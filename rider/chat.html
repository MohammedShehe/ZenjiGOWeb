<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat – ZenjiGO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <style>
    .chat-shell{display:grid;grid-template-columns:minmax(260px,320px) 1fr;gap:0;min-height:calc(100vh - 120px);border:1px solid var(--bs-border-color);border-radius:18px;overflow:hidden;background:var(--bs-body-bg);box-shadow:0 12px 40px rgba(15,35,55,.08)}
    .chat-list{border-right:1px solid var(--bs-border-color);display:flex;flex-direction:column;background:rgba(22,160,133,.03)}
    .chat-list-head{padding:14px 16px;border-bottom:1px solid var(--bs-border-color);font-weight:700}
    .chat-list-body{overflow-y:auto;flex:1}
    .conv-item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(0,0,0,.04);cursor:pointer;text-decoration:none;color:inherit;transition:.15s}
    .conv-item:hover,.conv-item.active{background:rgba(22,160,133,.1)}
    .conv-avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#16a085,#0b766e);color:#fff;font-weight:700;flex-shrink:0}
    .conv-meta{min-width:0;flex:1}
    .conv-meta .title{font-weight:650;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .conv-meta .preview{font-size:.78rem;color:var(--bs-secondary-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .conv-side{text-align:right;flex-shrink:0}
    .conv-side .time{font-size:.7rem;color:var(--bs-secondary-color)}
    .unread-pill{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#16a085;color:#fff;font-size:.7rem;font-weight:700}
    .chat-pane{display:flex;flex-direction:column;min-height:420px;background:linear-gradient(180deg,rgba(22,160,133,.04),transparent 120px)}
    .chat-pane-head{padding:12px 16px;border-bottom:1px solid var(--bs-border-color);display:flex;align-items:center;gap:12px;background:var(--bs-body-bg)}
    .chat-pane-body{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:8px}
    .msg-row{display:flex;max-width:78%}
    .msg-row.mine{align-self:flex-end;flex-direction:row-reverse}
    .msg-bubble{padding:10px 14px;border-radius:16px;font-size:.9rem;line-height:1.45;box-shadow:0 1px 2px rgba(0,0,0,.04);word-break:break-word}
    .msg-row.mine .msg-bubble{background:#16a085;color:#fff;border-bottom-right-radius:6px}
    .msg-row.theirs .msg-bubble{
      background:var(--bs-tertiary-bg, #f1f5f9);
      color:var(--bs-body-color, #0f172a);
      border:1px solid var(--bs-border-color);
      border-bottom-left-radius:6px;
    }
    .msg-bubble > div:first-child{color:inherit}
    .msg-time{font-size:.68rem;opacity:.85;margin-top:4px}
    .msg-row.mine .msg-time{text-align:right;color:rgba(255,255,255,.9)}
    .msg-row.theirs .msg-time{color:var(--bs-secondary-color, #64748b)}
    /* Dark mode: incoming bubbles must stay readable */
    body[data-theme="dark"] .msg-row.theirs .msg-bubble,
    html[data-bs-theme="dark"] .msg-row.theirs .msg-bubble,
    body[data-bs-theme="dark"] .msg-row.theirs .msg-bubble{
      background:#1e3a45;
      color:#e8f1f4;
      border-color:rgba(255,255,255,.12);
    }
    body[data-theme="dark"] .msg-row.theirs .msg-time,
    html[data-bs-theme="dark"] .msg-row.theirs .msg-time,
    body[data-bs-theme="dark"] .msg-row.theirs .msg-time{
      color:rgba(232,241,244,.7);
    }
    body[data-theme="dark"] .msg-row.mine .msg-bubble,
    html[data-bs-theme="dark"] .msg-row.mine .msg-bubble,
    body[data-bs-theme="dark"] .msg-row.mine .msg-bubble{
      background:#0d9488;
      color:#ffffff;
    }
    .chat-pane-foot{padding:12px 14px;border-top:1px solid var(--bs-border-color);background:var(--bs-body-bg)}
    .chat-empty{flex:1;display:grid;place-items:center;color:var(--bs-secondary-color);text-align:center;padding:32px}
    .chat-composer{display:flex;gap:8px;align-items:center}
    .chat-composer input{border-radius:999px;min-height:44px;padding-left:16px}
    .chat-composer button{border-radius:999px;min-width:44px;min-height:44px}
    @media(max-width:767.98px){
      .chat-shell{grid-template-columns:1fr;min-height:calc(100vh - 110px)}
      .chat-shell.show-thread .chat-list{display:none}
      .chat-shell:not(.show-thread) .chat-pane{display:none}
    }
  </style>
</head>
<body class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="app-sidebar" id="appSidebar">
    <div class="brand">Zenji<span>GO</span></div>
    <nav class="mt-2">
      <a href="dashboard.html" class="nav-link"><i class="bi bi-house"></i> Home</a>
      <a href="chat.html" class="nav-link active"><i class="bi bi-chat"></i> Chat</a>
      <a href="profile.html" class="nav-link"><i class="bi bi-person"></i> Profile</a>
      <a href="#" class="nav-link" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </nav>
  </aside>
  <div class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-link d-lg-none p-0" onclick="toggleSidebar()"><i class="bi bi-list fs-3"></i></button>
        <h5 class="mb-0 fw-bold">Messages</h5>
      </div>
      <button class="btn btn-aqua btn-sm" onclick="openSupport()"><i class="bi bi-headset me-1"></i>Support</button>
    </div>
    <div class="app-content">
      <div class="chat-shell" id="chatShell">
        <div class="chat-list">
          <div class="chat-list-head d-flex justify-content-between align-items-center">
            <span>Inbox</span>
            <button class="btn btn-sm btn-link text-teal p-0" onclick="loadConvs()"><i class="bi bi-arrow-clockwise"></i></button>
          </div>
          <div class="chat-list-body" id="convList"><div class="text-center py-5"><div class="spinner-zenji mx-auto"></div></div></div>
        </div>
        <div class="chat-pane" id="chatPane">
          <div class="chat-empty" id="chatEmpty">
            <div>
              <i class="bi bi-chat-dots display-6 d-block mb-2 text-teal"></i>
              <div class="fw-semibold">Select a conversation</div>
              <div class="small">Chat with your driver during a ride, or open Support anytime.</div>
            </div>
          </div>
          <div class="d-none flex-column h-100" id="chatActive" style="display:none;height:100%">
            <div class="chat-pane-head">
              <button class="btn btn-link d-md-none p-0 me-1" onclick="backToList()"><i class="bi bi-arrow-left fs-5"></i></button>
              <div class="conv-avatar" id="peerAvatar">S</div>
              <div class="flex-grow-1 min-w-0">
                <div class="fw-bold" id="chatTitle">—</div>
                <div class="small text-muted" id="chatSubtitle">—</div>
              </div>
            </div>
            <div class="chat-pane-body" id="messages"></div>
            <div class="chat-pane-foot">
              <form class="chat-composer" id="sendForm" autocomplete="off">
                <input type="text" id="msgInput" class="form-control" placeholder="Type a message…" maxlength="5000" required>
                <button class="btn btn-aqua" type="submit" id="btnSend" aria-label="Send"><i class="bi bi-send-fill"></i></button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/utils.js"></script>
  <script>
    if (!requireAuth('rider')) throw new Error('auth');
    const me = Api.getUser() || {};
    const myId = me.id || me.userId || null;
    let currentId = null;
    let socket = null;
    let convCache = [];

    function socketUrl() {
      try {
        const u = new URL(ZENJIGO_CONFIG.API_BASE);
        return u.origin;
      } catch (_) { return location.origin; }
    }

    function connectSocket() {
      if (socket) return;
      const token = Api.getAccessToken?.() || localStorage.getItem('zenjigo_access') || localStorage.getItem('accessToken');
      if (!token || typeof io === 'undefined') return;
      socket = io(socketUrl(), { auth: { token }, transports: ['websocket', 'polling'] });
      socket.on('connect', () => {
        if (currentId) socket.emit('chat:join', { conversationId: currentId });
      });
      socket.on('chat:message', (m) => {
        const cid = Number(m.conversationId || m.conversation_id);
        if (currentId && Number(currentId) === cid) {
          appendMsg(m);
          scrollMsgs();
          Api.rider.markRead?.(currentId);
        }
        loadConvs(true);
      });
      socket.on('chat:updated', () => loadConvs(true));
    }

    function fmtTime(v) {
      if (!v) return '';
      const d = new Date(v);
      if (Number.isNaN(d.getTime())) return '';
      const now = new Date();
      if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function convTitle(c) {
      if (c.type === 'support') return 'ZenjiGO Support';
      return c.peerName || c.title || (c.type === 'ride' ? 'Ride chat' : 'Chat');
    }

    function convSubtitle(c) {
      if (c.type === 'support') return 'Customer support';
      if (c.peerRole === 'driver') return 'Your driver';
      return c.type || '';
    }

    async function loadConvs(silent) {
      try {
        const data = await Api.rider.conversations();
        convCache = Array.isArray(data) ? data : [];
        const el = document.getElementById('convList');
        if (!convCache.length) {
          el.innerHTML = '<div class="text-center py-5 text-muted small px-3">No conversations yet.<br>Tap <strong>Support</strong> to message the team.</div>';
          return;
        }
        el.innerHTML = convCache.map((c) => {
          const unread = Number(c.unreadCount || 0);
          const active = Number(currentId) === Number(c.id) ? ' active' : '';
          const initial = (convTitle(c).charAt(0) || '?').toUpperCase();
          return `<a href="#" class="conv-item${active}" data-id="${c.id}" onclick="return openChat(${c.id})">
            <div class="conv-avatar">${initial}</div>
            <div class="conv-meta">
              <div class="title">${escapeHtml(convTitle(c))}</div>
              <div class="preview">${escapeHtml(c.lastMessage || 'No messages yet')}</div>
            </div>
            <div class="conv-side">
              <div class="time">${fmtTime(c.lastMessageAt || c.updatedAt)}</div>
              ${unread > 0 ? `<span class="unread-pill mt-1">${unread > 99 ? '99+' : unread}</span>` : ''}
            </div>
          </a>`;
        }).join('');
      } catch (e) {
        if (!silent) document.getElementById('convList').innerHTML = '<div class="p-3 text-danger small">' + escapeHtml(e.message) + '</div>';
      }
    }

    function isMine(m) {
      if (m.isMine === true || m.isMine === 1) return true;
      if (myId && Number(m.senderId || m.sender_id) === Number(myId)) return true;
      if (m.senderRole === 'rider') return true;
      return false;
    }

    function appendMsg(m) {
      const box = document.getElementById('messages');
      if (!box) return;
      if (box.querySelector(`[data-mid="${m.id}"]`)) return;
      const mine = isMine(m);
      const div = document.createElement('div');
      div.className = 'msg-row ' + (mine ? 'mine' : 'theirs');
      div.dataset.mid = m.id;
      div.innerHTML = `<div class="msg-bubble"><div>${escapeHtml(m.text || m.body || '')}</div><div class="msg-time">${fmtTime(m.createdAt || m.created_at)}</div></div>`;
      box.appendChild(div);
    }

    function scrollMsgs() {
      const box = document.getElementById('messages');
      if (box) box.scrollTop = box.scrollHeight;
    }

    async function openChat(id) {
      id = Number(id);
      currentId = id;
      const c = convCache.find((x) => Number(x.id) === id) || { id, type: 'chat' };
      document.getElementById('chatEmpty').classList.add('d-none');
      const active = document.getElementById('chatActive');
      active.classList.remove('d-none');
      active.style.display = 'flex';
      document.getElementById('chatTitle').textContent = convTitle(c);
      document.getElementById('chatSubtitle').textContent = convSubtitle(c);
      document.getElementById('peerAvatar').textContent = (convTitle(c).charAt(0) || '?').toUpperCase();
      document.getElementById('chatShell').classList.add('show-thread');
      document.getElementById('messages').innerHTML = '<div class="text-center py-4"><div class="spinner-zenji mx-auto"></div></div>';
      try {
        const msgs = await Api.rider.messages(id);
        const list = Array.isArray(msgs) ? msgs : [];
        document.getElementById('messages').innerHTML = '';
        list.forEach(appendMsg);
        scrollMsgs();
        try { await Api.rider.markRead?.(id); } catch (_) {}
        try { document.querySelectorAll('.nav-msg-badge').forEach(b => b.remove()); } catch (_) {}
        try { if (window.zenjiDriverRefreshMsgBadge) window.zenjiDriverRefreshMsgBadge(); } catch (_) {}
        if (socket?.connected) socket.emit('chat:join', { conversationId: id });
        loadConvs(true);
      } catch (e) {
        document.getElementById('messages').innerHTML = '<p class="text-danger small">' + escapeHtml(e.message) + '</p>';
      }
      return false;
    }

    function backToList() {
      document.getElementById('chatShell').classList.remove('show-thread');
    }

    async function openSupport() {
      try {
        const c = await Api.rider.openSupport();
        const id = c.conversationId || c.id;
        showToast('Support chat ready');
        await loadConvs();
        if (id) openChat(id);
      } catch (e) { showToast(e.message, 'error'); }
    }

    document.getElementById('sendForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text || !currentId) return;
      const btn = document.getElementById('btnSend');
      btn.disabled = true;
      try {
        const m = await Api.rider.sendMessage(currentId, text);
        input.value = '';
        appendMsg(m || { id: 'tmp-' + Date.now(), text, isMine: true, createdAt: new Date().toISOString(), senderRole: 'rider' });
        scrollMsgs();
        loadConvs(true);
      } catch (err) { showToast(err.message, 'error'); }
      finally { btn.disabled = false; input.focus(); }
    });

    // Optional markRead helper on API
    if (Api.rider && !Api.rider.markRead) {
      Api.rider.markRead = (id) => Api.request ? Api.request('POST', `/rider/chat/${id}/read`) :
        fetch((ZENJIGO_CONFIG.API_BASE || '') + `/rider/chat/${id}/read`, {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + (localStorage.getItem('zenjigo_access') || localStorage.getItem('accessToken') || ''), Accept: 'application/json' }
        }).then(r => r.json());
    }


    async function markAllConvsReadOnEnter() {
      try {
        const data = await Api.rider.conversations();
        const list = Array.isArray(data) ? data : [];
        await Promise.all(list.filter(c => Number(c.unreadCount || 0) > 0).map(c =>
          Api.rider.markRead(c.id).catch(() => null)
        ));
        document.querySelectorAll('.nav-msg-badge').forEach(b => b.remove());
      } catch (_) {}
    }
    connectSocket();
    loadConvs();
    markAllConvsReadOnEnter();
  </script>
  <script src="../js/i18n.js"></script>
  <script src="../js/rider-ui.js"></script>
</body>
</html>
