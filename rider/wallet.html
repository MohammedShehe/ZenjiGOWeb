<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet – ZenjiGO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="app-sidebar" id="appSidebar">
    <div class="brand">Zenji<span>GO</span> <small class="d-block text-white-50 fs-6 fw-normal">Rider</small></div>
    <nav class="mt-2">
      <a href="dashboard.html" class="nav-link"><i class="bi bi-house"></i> Home</a>
      <a href="book.html" class="nav-link"><i class="bi bi-plus-circle"></i> Book Ride</a>
      <a href="history.html" class="nav-link"><i class="bi bi-clock-history"></i> History</a>
      <a href="wallet.html" class="nav-link active"><i class="bi bi-wallet2"></i> Wallet</a>
      <a href="profile.html" class="nav-link"><i class="bi bi-person"></i> Profile</a>
      <a href="#" class="nav-link" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </nav>
  </aside>
  <div class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-link d-lg-none p-0" onclick="toggleSidebar()"><i class="bi bi-list fs-3 text-dark"></i></button>
        <h5 class="mb-0 fw-bold">Wallet</h5>
      </div>
    </div>
    <div class="app-content">
      <div class="row g-4">
        <div class="col-md-5">
          <div class="card-zenji p-4 text-white" style="background:linear-gradient(135deg,var(--dark-bg),var(--ocean-teal));">
            <div class="small opacity-75">Available balance</div>
            <h2 class="fw-bold mb-3" id="balance">—</h2>
            <button class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#topupModal">Top up</button>
          </div>
        </div>
        <div class="col-md-7">
          <div class="card-zenji">
            <div class="card-header">Transactions</div>
            <div class="card-body p-0" id="txns">
              <div class="text-center py-4"><div class="spinner-zenji mx-auto"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Topup Modal -->
  <div class="modal fade" id="topupModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold">Top up wallet</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Amount (TZS)</label>
            <input type="number" id="topupAmount" class="form-control" min="1000" step="500" value="10000">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Payment method</label>
            <select id="topupMethod" class="form-select">
              <option value="momo">Mobile Money</option>
              <option value="card">Card</option>
              <option value="bank">Bank</option>
            </select>
          </div>
          <button class="btn btn-primary-zenji" id="btnTopup" onclick="doTopup()">Top up</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    if (!requireAuth('rider')) throw new Error('auth');

    async function load() {
      try {
        const bal = await Api.rider.walletBalance();
        document.getElementById('balance').textContent = formatMoney(bal.balance ?? bal.amount ?? bal);
      } catch { document.getElementById('balance').textContent = 'TZS 0'; }

      try {
        const tx = await Api.rider.walletTransactions();
        const list = Array.isArray(tx) ? tx : (tx.transactions || []);
        const el = document.getElementById('txns');
        if (!list.length) {
          el.innerHTML = '<div class="text-center py-4 text-muted small">No transactions yet.</div>';
          return;
        }
        el.innerHTML = list.map(t => `
          <div class="d-flex justify-content-between px-3 py-3 border-bottom">
            <div>
              <div class="fw-semibold small">${t.type || t.description || 'Transaction'}</div>
              <div class="text-muted" style="font-size:0.75rem">${formatDate(t.createdAt || t.created_at)}</div>
            </div>
            <div class="fw-semibold ${Number(t.amount) >= 0 ? 'text-success' : 'text-danger'}">
              ${Number(t.amount) >= 0 ? '+' : ''}${formatMoney(t.amount)}
            </div>
          </div>`).join('');
      } catch (e) {
        document.getElementById('txns').innerHTML = `<div class="text-center py-4 text-muted small">${e.message}</div>`;
      }
    }

    async function doTopup() {
      const amount = parseFloat(document.getElementById('topupAmount').value);
      const method = document.getElementById('topupMethod').value;
      if (!amount || amount < 1000) { showToast('Enter a valid amount', 'error'); return; }
      const btn = document.getElementById('btnTopup');
      setLoading(btn, true);
      try {
        await Api.rider.topUp(amount, method);
        showToast('Top-up initiated');
        bootstrap.Modal.getInstance(document.getElementById('topupModal')).hide();
        load();
      } catch (e) {
        showToast(e.message || 'Top-up failed', 'error');
      } finally {
        setLoading(btn, false);
      }
    }
    load();
  </script>
  <script src="../js/rider-ui.js"></script>
</body>
</html>
