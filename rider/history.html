<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ride History – ZenjiGO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="app-sidebar" id="appSidebar">
    <div class="brand">Zenji<span>GO</span> <small class="d-block text-white-50 fs-6 fw-normal">Rider</small></div>
    <nav class="mt-2">
      <a href="dashboard.html" class="nav-link"><i class="bi bi-house"></i> Home</a>
      <a href="book.html" class="nav-link"><i class="bi bi-plus-circle"></i> Book Ride</a>
      <a href="history.html" class="nav-link active"><i class="bi bi-clock-history"></i> History</a>
      <a href="wallet.html" class="nav-link"><i class="bi bi-wallet2"></i> Wallet</a>
      <a href="profile.html" class="nav-link"><i class="bi bi-person"></i> Profile</a>
      <a href="#" class="nav-link" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </nav>
  </aside>
  <div class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-link d-lg-none p-0" onclick="toggleSidebar()"><i class="bi bi-list fs-3 text-dark"></i></button>
        <h5 class="mb-0 fw-bold">Ride History</h5>
      </div>
    </div>
    <div class="app-content">
      <div class="card-zenji">
        <div class="card-body p-0" id="list">
          <div class="text-center py-5"><div class="spinner-zenji mx-auto"></div></div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    if (!requireAuth('rider')) throw new Error('auth');
    (async () => {
      try {
        const rides = await Api.rider.history();
        const list = Array.isArray(rides) ? rides : (rides.rides || []);
        const el = document.getElementById('list');
        if (!list.length) {
          el.innerHTML = '<div class="text-center py-5 text-muted">No rides yet.</div>';
          return;
        }
        el.innerHTML = list.map(r => `
          <a href="ride.html?id=${r.id}" class="d-flex justify-content-between align-items-center px-3 py-3 border-bottom text-decoration-none text-dark">
            <div>
              <div class="fw-semibold">${r.pickupAddress || 'Pickup'} → ${r.destinationAddress || 'Drop-off'}</div>
              <div class="text-muted small">${formatDate(r.createdAt || r.created_at)} · ${(r.rideType || '').toUpperCase()}</div>
            </div>
            <div class="text-end">
              <div class="fw-semibold">${formatMoney(r.fare || r.totalFare || r.amount)}</div>
              <span class="status-badge status-${(r.status||'')==='completed'?'online':'pending'}">${r.status||''}</span>
            </div>
          </a>`).join('');
      } catch (e) {
        document.getElementById('list').innerHTML = `<div class="text-center py-5 text-danger">${e.message}</div>`;
      }
    })();
  </script>
</body>
</html>
