<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Ride – ZenjiGO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="app-sidebar" id="appSidebar">
    <div class="brand">Zenji<span>GO</span> <small class="d-block text-white-50 fs-6 fw-normal">Rider</small></div>
    <nav class="mt-2">
      <a href="dashboard.html" class="nav-link"><i class="bi bi-house"></i> Home</a>
      <a href="book.html" class="nav-link active"><i class="bi bi-plus-circle"></i> Book Ride</a>
      <a href="history.html" class="nav-link"><i class="bi bi-clock-history"></i> History</a>
      <a href="wallet.html" class="nav-link"><i class="bi bi-wallet2"></i> Wallet</a>
      <a href="profile.html" class="nav-link"><i class="bi bi-person"></i> Profile</a>
      <a href="#" class="nav-link" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </nav>
  </aside>

  <div class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-link d-lg-none p-0" onclick="toggleSidebar()"><i class="bi bi-list fs-3 text-dark"></i></button>
        <h5 class="mb-0 fw-bold">Book a Ride</h5>
      </div>
    </div>

    <div class="app-content">
      <div class="row g-4">
        <div class="col-lg-6">
          <div class="card-zenji p-4">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Pickup address</label>
              <input type="text" id="pickupAddress" class="form-control" placeholder="Search pickup location">
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small fw-semibold">Pickup lat</label>
                <input type="number" step="any" id="pickupLat" class="form-control" value="-6.1659" placeholder="-6.16">
              </div>
              <div class="col-6">
                <label class="form-label small fw-semibold">Pickup lng</label>
                <input type="number" step="any" id="pickupLng" class="form-control" value="39.2026" placeholder="39.20">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Destination address</label>
              <input type="text" id="destAddress" class="form-control" placeholder="Search destination">
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small fw-semibold">Dest lat</label>
                <input type="number" step="any" id="destLat" class="form-control" value="-5.7265" placeholder="-5.72">
              </div>
              <div class="col-6">
                <label class="form-label small fw-semibold">Dest lng</label>
                <input type="number" step="any" id="destLng" class="form-control" value="39.2946" placeholder="39.29">
              </div>
            </div>

            <label class="form-label small fw-semibold">Ride type</label>
            <div class="row g-2 mb-3" id="rideTypes"></div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Payment method</label>
              <select id="paymentMethod" class="form-select">
                <option value="cash">Cash</option>
                <option value="momo">Mobile Money</option>
                <option value="wallet">ZenjiGO Wallet</option>
                <option value="card">Card</option>
              </select>
            </div>

            <div class="d-flex gap-2">
              <button class="btn btn-outline-secondary flex-fill" id="btnQuote" onclick="getQuote()">Get Quote</button>
              <button class="btn btn-primary-zenji flex-fill" id="btnBook" onclick="bookRide()" disabled>Confirm Booking</button>
            </div>

            <div id="quoteBox" class="mt-3 p-3 rounded-3 bg-aqua-soft d-none">
              <div class="d-flex justify-content-between">
                <span>Estimated fare</span>
                <strong id="quoteFare" class="text-teal">—</strong>
              </div>
              <div class="small text-muted mt-1" id="quoteMeta"></div>
            </div>
          </div>
        </div>
        <div class="col-lg-6">
          <div id="bookingMap" class="mb-3 rounded-3 overflow-hidden border" style="height:320px;min-height:280px;background:#e8f4f3;"></div>

          <div class="card-zenji p-3">
            <p class="small text-muted mb-0">
              <i class="bi bi-info-circle me-1"></i>
              Enter realistic coordinates for Zanzibar (approx. lat -6.1 to -5.7, lng 39.1 to 39.5).
              The backend calculates distance and fare from these points.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    if (!requireAuth('rider')) throw new Error('auth');

    let selectedType = new URLSearchParams(location.search).get('type') || 'boda';
    let lastQuote = null;

    // Render ride types
    document.getElementById('rideTypes').innerHTML = ZENJIGO_CONFIG.RIDE_TYPES.map(t => `
      <div class="col-4">
        <div class="ride-type-card py-2 ${t.id === selectedType ? 'active' : ''}" data-type="${t.id}" onclick="selectType('${t.id}')">
          <i class="bi ${t.icon}"></i>
          <div class="small fw-semibold mt-1">${t.name}</div>
        </div>
      </div>`).join('');

    function selectType(id) {
      selectedType = id;
      document.querySelectorAll('.ride-type-card').forEach(el => {
        el.classList.toggle('active', el.dataset.type === id);
      });
      lastQuote = null;
      document.getElementById('quoteBox').classList.add('d-none');
      document.getElementById('btnBook').disabled = true;
    }

    function coordsBody() {
      return {
        rideType: selectedType,
        pickupLat: parseFloat(document.getElementById('pickupLat').value),
        pickupLng: parseFloat(document.getElementById('pickupLng').value),
        destinationLat: parseFloat(document.getElementById('destLat').value),
        destinationLng: parseFloat(document.getElementById('destLng').value)
      };
    }

    async function getQuote() {
      const pickupAddress = document.getElementById('pickupAddress').value.trim();
      const destAddress = document.getElementById('destAddress').value.trim();
      if (!pickupAddress || !destAddress) {
        showToast('Enter pickup and destination addresses', 'error');
        return;
      }
      const btn = document.getElementById('btnQuote');
      setLoading(btn, true);
      try {
        const q = await Api.rider.quote(coordsBody());
        lastQuote = q;
        document.getElementById('quoteFare').textContent = formatMoney(q.fare || q.estimatedFare || q.total || q.amount);
        document.getElementById('quoteMeta').textContent =
          (q.distanceKm ? q.distanceKm + ' km · ' : '') +
          (q.durationMin ? q.durationMin + ' min' : '') +
          (q.currency ? ' · ' + q.currency : '');
        document.getElementById('quoteBox').classList.remove('d-none');
        document.getElementById('btnBook').disabled = false;
      } catch (e) {
        showToast(e.message || 'Quote failed', 'error');
      } finally {
        setLoading(btn, false);
      }
    }

    async function bookRide() {
      const body = {
        ...coordsBody(),
        pickupAddress: document.getElementById('pickupAddress').value.trim(),
        destinationAddress: document.getElementById('destAddress').value.trim(),
        paymentMethod: document.getElementById('paymentMethod').value
      };
      const btn = document.getElementById('btnBook');
      setLoading(btn, true);
      try {
        const ride = await Api.rider.createRide(body);
        showToast('Ride requested!');
        const id = ride.id || ride.rideId;
        setTimeout(() => location.href = id ? `ride.html?id=${id}` : 'history.html', 800);
      } catch (e) {
        showToast(e.message || 'Booking failed', 'error');
      } finally {
        setLoading(btn, false);
      }
    }
  </script>
  <script src="../js/rider-ui.js"></script>
  <script src="../js/map.js"></script>

<script>
(async function initBookingMap() {
  if (!window.ZenjiMap) return;
  const $ = (id) => document.getElementById(id);
  const pickupLat = () => Number($('pickupLat')?.value || -6.1659);
  const pickupLng = () => Number($('pickupLng')?.value || 39.2026);
  const destLat = () => Number($('destLat')?.value || -5.7265);
  const destLng = () => Number($('destLng')?.value || 39.2946);

  function refreshMarkers() {
    if (!window.__bookingMap) return;
    window.__bookingMap.setMarkers([
      { id: 'pickup', lat: pickupLat(), lng: pickupLng(), label: 'P', draggable: true },
      { id: 'dest', lat: destLat(), lng: destLng(), label: 'D', draggable: true }
    ]);
  }

  try {
    // Prefer current location for map center
    const here = await ZenjiMap.getCurrentPosition(6000);
    const center = here || { lat: pickupLat(), lng: pickupLng() };
    if (here && $('pickupLat') && !$('pickupLat').dataset.userSet) {
      $('pickupLat').value = here.lat.toFixed(6);
      $('pickupLng').value = here.lng.toFixed(6);
    }

    window.__bookingMap = await ZenjiMap.createMap('bookingMap', {
      center,
      zoom: 14,
      markers: [
        { id: 'pickup', lat: pickupLat(), lng: pickupLng(), label: 'P', draggable: true },
        { id: 'dest', lat: destLat(), lng: destLng(), label: 'D', draggable: true }
      ],
      onMarkerDrag({ lat, lng, id }) {
        if (id === 'pickup') {
          $('pickupLat').value = lat.toFixed(6);
          $('pickupLng').value = lng.toFixed(6);
          $('pickupLat').dataset.userSet = '1';
        } else if (id === 'dest') {
          $('destLat').value = lat.toFixed(6);
          $('destLng').value = lng.toFixed(6);
        }
      }
    });

    // Places search → fill address + coordinates
    if ($('pickupAddress')) {
      await ZenjiMap.attachAutocomplete($('pickupAddress'), (place) => {
        $('pickupAddress').value = place.address;
        $('pickupLat').value = place.lat.toFixed(6);
        $('pickupLng').value = place.lng.toFixed(6);
        $('pickupLat').dataset.userSet = '1';
        refreshMarkers();
        window.__bookingMap.setCenter({ lat: place.lat, lng: place.lng }, 15);
      }, { country: (ZENJIGO_CONFIG.MAP && ZENJIGO_CONFIG.MAP.COUNTRY) || 'tz' });
    }
    if ($('destAddress')) {
      await ZenjiMap.attachAutocomplete($('destAddress'), (place) => {
        $('destAddress').value = place.address;
        $('destLat').value = place.lat.toFixed(6);
        $('destLng').value = place.lng.toFixed(6);
        refreshMarkers();
      }, { country: (ZENJIGO_CONFIG.MAP && ZENJIGO_CONFIG.MAP.COUNTRY) || 'tz' });
    }
  } catch (e) {
    console.warn('Map:', e.message || e);
    const box = $('bookingMap');
    if (box) box.innerHTML = '<div class="p-4 text-center text-muted small">Map unavailable. Set GOOGLE_MAPS_API_KEY in js/config.js (Maps JavaScript API + Places).</div>';
  }
})();
</script>

</body>
</html>
