<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promotions & Offers – ZenjiGO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <style>
    .offer{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--ui-border,#e5e7eb);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:inherit}
    .offer:last-child{border-bottom:0}.offer:hover{background:rgba(11,153,146,.06)}
    .offer .ic{width:44px;height:44px;border-radius:50%;background:rgba(11,153,146,.12);color:#0b9992;display:grid;place-items:center;font-size:1.2rem;flex:none}
  </style>
</head>
<body class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="app-sidebar" id="appSidebar">
    <div class="brand">Zenji<span>GO</span></div>
    <nav class="mt-2"></nav>
  </aside>
  <div class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-link d-lg-none p-0" onclick="toggleSidebar()"><i class="bi bi-list fs-3"></i></button>
        <h5 class="mb-0 fw-bold">Promotions &amp; Offers</h5>
      </div>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-secondary btn-sm" type="button" onclick="load()" title="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
      </div>
    </div>
    <div class="app-content" style="max-width:820px">
      <div class="alert alert-success d-none align-items-center justify-content-between" id="appliedBar">
        <span><i class="bi bi-check-circle-fill me-2"></i>Promo <strong id="appliedCode"></strong> will be applied to your next ride.</span>
        <button class="btn btn-sm btn-outline-success" type="button" onclick="clearPromo()">Remove</button>
      </div>
      <div class="card-zenji mb-4"><div class="card-body p-3">
        <label class="form-label small fw-semibold" for="codeInput">Have a promo code?</label>
        <div class="input-group">
          <input id="codeInput" class="form-control text-uppercase" placeholder="Enter code" maxlength="32" autocomplete="off">
          <button class="btn btn-primary-zenji" type="button" id="btnCode" data-no-auto-loading="true">Apply</button>
        </div>
      </div></div>
      <div class="card-zenji"><div class="card-body p-0" id="offers"><div class="text-center py-4"><div class="spinner-zenji mx-auto"></div></div></div></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/utils.js"></script>
  <script>
    if (!requireAuth('rider')) throw new Error('auth');
    const $ = (id) => document.getElementById(id);
    const KEY = 'zenjigo_pending_promo';
    let offers = [];

    const val = (o, keys, fb = '') => { for (const k of keys) if (o && o[k] != null && String(o[k]).trim() !== '') return String(o[k]); return fb; };
    function pending() { try { return JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch (_) { return null; } }
    function renderApplied() {
      const p = pending();
      $('appliedBar').classList.toggle('d-none', !p);
      $('appliedBar').classList.toggle('d-flex', !!p);
      if (p) $('appliedCode').textContent = p.code;
    }
    function clearPromo() { sessionStorage.removeItem(KEY); renderApplied(); showToast('Promo removed.'); }

    // Validates with the server, then keeps it for the next booking (same as the app).
    async function applyCode(code, btn) {
      code = String(code || '').trim().toUpperCase();
      if (!code) return showToast('This offer has no code from the server.', 'error');
      if (btn) setLoading(btn, true);
      try {
        const r = await Api.rider.applyPromo(code);
        sessionStorage.setItem(KEY, JSON.stringify({ code: (r && r.code) || code, discount: Number(r && r.discount) || 0 }));
        renderApplied();
        showToast('Promo validated by the server. It will be applied to your next ride.');
      } catch (e) {
        sessionStorage.removeItem(KEY); renderApplied();
        showToast(e.message || 'Promo could not be applied.', 'error');
      } finally { if (btn) setLoading(btn, false); }
    }

    async function load() {
      const el = $('offers');
      el.innerHTML = '<div class="text-center py-4"><div class="spinner-zenji mx-auto"></div></div>';
      try {
        offers = pickList(await Api.rider.promos(), ['promos', 'items']);
        if (!offers.length) { el.innerHTML = '<div class="text-center py-5 text-muted">No promotions are currently available.</div>'; return; }
        el.innerHTML = offers.map((o, i) => {
          const until = val(o, ['validUntil', 'valid_until']);
          return `<button type="button" class="offer" data-i="${i}">
            <span class="ic"><i class="bi bi-tag"></i></span>
            <span class="flex-grow-1"><span class="fw-bold d-block">${esc(val(o, ['code', 'promoCode', 'name', 'title'], 'Promotion'))}</span>
              <span class="small text-muted">${esc(val(o, ['description', 'details', 'discountDescription', 'title']))}${until ? ' · valid until ' + esc(formatEat(until, false)) : ''}</span></span>
            <i class="bi bi-chevron-right text-muted"></i></button>`;
        }).join('');
        el.querySelectorAll('.offer').forEach((b) => b.addEventListener('click', () => { const o = offers[Number(b.dataset.i)]; applyCode(val(o, ['code', 'promoCode', 'id'])); }));
      } catch (e) {
        el.innerHTML = `<div class="text-center py-4"><div class="mb-2">${esc(e.message)}</div><button class="btn btn-primary-zenji" data-no-auto-loading="true" onclick="load()">Retry</button></div>`;
      }
    }
    $('btnCode').addEventListener('click', () => applyCode($('codeInput').value, $('btnCode')));
    $('codeInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') applyCode($('codeInput').value, $('btnCode')); });
    renderApplied(); load();
  </script>
  <script src="../js/rider-ui.js"></script>
</body>
</html>
