<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ride – ZenjiGO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="app-sidebar" id="appSidebar">
    <div class="brand">Zenji<span>GO</span> <small class="d-block text-white-50 fs-6 fw-normal">Rider</small></div>
    <nav class="mt-2">
      <a href="dashboard.html" class="nav-link"><i class="bi bi-house"></i> Home</a>
      <a href="history.html" class="nav-link active"><i class="bi bi-clock-history"></i> History</a>
      <a href="profile.html" class="nav-link"><i class="bi bi-person"></i> Profile</a>
      <a href="#" class="nav-link" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </nav>
  </aside>
  <div class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-link d-lg-none p-0" onclick="toggleSidebar()"><i class="bi bi-list fs-3 text-dark"></i></button>
        <a href="history.html" class="btn btn-link p-0 me-2"><i class="bi bi-arrow-left fs-5"></i></a>
        <h5 class="mb-0 fw-bold">Ride details</h5>
      </div>
    </div>
    <div class="app-content">
      <div class="row g-4">
        <div class="col-lg-7">
          <div class="map-placeholder mb-3" id="mapBox">
            <div class="text-center"><i class="bi bi-geo-alt fs-1"></i><br>Tracking map</div>
          </div>
          <div class="card-zenji p-4" id="rideInfo">
            <div class="text-center py-4"><div class="spinner-zenji mx-auto"></div></div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="card-zenji p-4 mb-3" id="driverBox" style="display:none">
            <h6 class="fw-bold">Driver</h6>
            <div id="driverInfo"></div>
          </div>
          <div class="card-zenji p-4" id="actionsBox" style="display:none">
            <div class="d-grid gap-2" id="actions"></div>
          </div>
          <div class="card-zenji p-4 mt-3 d-none" id="rateBox">
            <h6 class="fw-bold mb-3">Rate this ride</h6>
            <div class="mb-2">
              <label class="form-label small">Stars (1-5)</label>
              <input type="number" id="stars" class="form-control" min="1" max="5" value="5">
            </div>
            <div class="mb-3">
              <label class="form-label small">Feedback</label>
              <textarea id="feedback" class="form-control" rows="2"></textarea>
            </div>
            <button class="btn btn-primary-zenji" onclick="submitRating()">Submit rating</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    if (!requireAuth('rider')) throw new Error('auth');
    const id = new URLSearchParams(location.search).get('id');
    if (!id) location.href = 'history.html';
    let pollTimer;
    async function load() {
      try {
        const ride = await Api.rider.getRide(id);
        render(ride);
        const st = (ride.status || '').toLowerCase();
        if (['requested','accepted','arriving','arrived','started'].includes(st)) {
          try {
            const track = await Api.rider.track(id);
            if (track.driverLat) {
              document.getElementById('mapBox').innerHTML = '<div class="text-center"><i class="bi bi-geo-alt-fill fs-1 text-teal"></i><br>Driver at ' + Number(track.driverLat).toFixed(4) + ', ' + Number(track.driverLng).toFixed(4) + '</div>';
            }
          } catch (e) {}
          pollTimer = setTimeout(load, 8000);
        }
      } catch (e) {
        document.getElementById('rideInfo').innerHTML = '<div class="text-danger">' + e.message + '</div>';
      }
    }
    function render(r) {
      const st = (r.status || '').toLowerCase();
      document.getElementById('rideInfo').innerHTML = '<div class="d-flex justify-content-between mb-3"><span class="status-badge status-' + (st==='completed'?'online':st==='cancelled'?'offline':'active') + '">' + r.status + '</span><span class="fw-bold">' + formatMoney(r.fare || r.totalFare || r.amount) + '</span></div><div class="mb-2"><i class="bi bi-circle-fill text-success me-2" style="font-size:0.5rem"></i>' + (r.pickupAddress || 'Pickup') + '</div><div class="mb-3"><i class="bi bi-geo-alt-fill text-danger me-2"></i>' + (r.destinationAddress || 'Destination') + '</div><div class="small text-muted">Type: ' + (r.rideType||'').toUpperCase() + ' · ' + formatDate(r.createdAt||r.created_at) + '</div>';
      if (r.driver) {
        document.getElementById('driverBox').style.display = 'block';
        document.getElementById('driverInfo').innerHTML = '<div class="fw-semibold">' + (r.driver.fullName || r.driver.name || 'Driver') + '</div><div class="small text-muted">' + (r.driver.vehicleType || '') + ' · ' + (r.driver.plateNumber || '') + '</div><div class="small">' + (r.driver.phone || '') + '</div>';
      }
      const actions = document.getElementById('actions');
      document.getElementById('actionsBox').style.display = 'block';
      let html = '';
      if (['requested','accepted','arriving','arrived'].includes(st)) {
        html += '<button class="btn btn-outline-danger" onclick="cancelRide()">Cancel ride</button>';
      }
      if (st === 'completed' && !r.rating) {
        document.getElementById('rateBox').classList.remove('d-none');
      }
      if (!html) html = '<p class="small text-muted mb-0">No actions available.</p>';
      actions.innerHTML = html;
    }
    async function cancelRide() {
      if (!confirm('Cancel this ride?')) return;
      try {
        await Api.rider.cancelRide(id, 'Changed mind');
        showToast('Ride cancelled');
        load();
      } catch (e) { showToast(e.message, 'error'); }
    }
    async function submitRating() {
      const stars = parseInt(document.getElementById('stars').value, 10);
      const feedback = document.getElementById('feedback').value.trim();
      try {
        await Api.rider.rate(id, stars, feedback || undefined);
        showToast('Thanks for rating!');
        document.getElementById('rateBox').classList.add('d-none');
      } catch (e) { showToast(e.message, 'error'); }
    }
    load();
    window.addEventListener('beforeunload', function() { clearTimeout(pollTimer); });
  </script>
</body>
</html>
