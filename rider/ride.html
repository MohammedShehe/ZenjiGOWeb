<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ride – ZenjiGO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="app-sidebar" id="appSidebar">
    <div class="brand">Zenji<span>GO</span> <small class="d-block text-white-50 fs-6 fw-normal">Rider</small></div>
    <nav class="mt-2">
      <a href="dashboard.html" class="nav-link"><i class="bi bi-house"></i> Home</a>
      <a href="history.html" class="nav-link active"><i class="bi bi-clock-history"></i> History</a>
      <a href="profile.html" class="nav-link"><i class="bi bi-person"></i> Profile</a>
      <a href="#" class="nav-link" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </nav>
  </aside>
  <div class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-link d-lg-none p-0" onclick="toggleSidebar()"><i class="bi bi-list fs-3 text-dark"></i></button>
        <a href="history.html" class="btn btn-link p-0 me-2"><i class="bi bi-arrow-left fs-5"></i></a>
        <h5 class="mb-0 fw-bold">Ride details</h5>
      </div>
    </div>
    <div class="app-content">
      <div class="row g-4">
        <div class="col-lg-7">
          <div id="mapBox" class="mb-3 rounded-3 overflow-hidden border" style="height:280px;min-height:240px;background:#e8f4f3;"></div>
          </div>
          <div class="card-zenji p-4" id="rideInfo">
            <div class="text-center py-4"><div class="spinner-zenji mx-auto"></div></div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="card-zenji p-4 mb-3" id="driverBox" style="display:none">
            <h6 class="fw-bold">Driver</h6>
            <div id="driverInfo"></div>
          </div>
          <div class="card-zenji p-4" id="actionsBox" style="display:none">
            <div class="d-grid gap-2" id="actions"></div>
          </div>
          <div class="card-zenji p-4 mt-3 d-none" id="rateBox">
            <h6 class="fw-bold mb-3">Rate this ride</h6>
            <div class="mb-2">
              <label class="form-label small">Stars (1-5)</label>
              <input type="number" id="stars" class="form-control" min="1" max="5" value="5">
            </div>
            <div class="mb-3">
              <label class="form-label small">Feedback</label>
              <textarea id="feedback" class="form-control" rows="2"></textarea>
            </div>
            <button class="btn btn-primary-zenji" onclick="submitRating()">Submit rating</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    if (!requireAuth('rider')) throw new Error('auth');
    const id = new URLSearchParams(location.search).get('id');
    if (!id) location.href = 'history.html';
    let pollTimer;
    async function load() {
      try {
        const ride = await Api.rider.getRide(id);
        render(ride);
        const st = (ride.status || '').toLowerCase();
        if (['searching','requested','accepted','arriving','arrived','started'].includes(st)) {
          try {
            const track = await Api.rider.track(id);
            if (track.driverLat) {
              if (window.__rideMap) {
              window.__rideMap.setMarkers([
                { id: 'driver', lat: track.driverLat, lng: track.driverLng, label: 'Driver' },
                track.pickupLat ? { id: 'pickup', lat: track.pickupLat, lng: track.pickupLng, label: 'Pickup' } : null
              ].filter(Boolean));
              window.__rideMap.setCenter({ lat: track.driverLat, lng: track.driverLng });
            } else {
              document.getElementById('mapBox').innerHTML = '<div class="text-center p-4"><i class="bi bi-geo-alt-fill fs-1 text-teal"></i><br>Driver at ' + Number(track.driverLat).toFixed(4) + ', ' + Number(track.driverLng).toFixed(4) + '</div>';
            }
            }
          } catch (e) {}
          pollTimer = setTimeout(load, 8000);
        }
      } catch (e) {
        document.getElementById('rideInfo').innerHTML = '<div class="text-danger">' + e.message + '</div>';
      }
    }
    function render(r) {
      const st = (r.status || '').toLowerCase();
      document.getElementById('rideInfo').innerHTML = '<div class="d-flex justify-content-between mb-3"><span class="status-badge status-' + (st==='completed'?'online':st==='cancelled'?'offline':'active') + '">' + r.status + '</span><span class="fw-bold">' + formatMoney(r.fare || r.totalFare || r.amount) + '</span></div><div class="mb-2"><i class="bi bi-circle-fill text-success me-2" style="font-size:0.5rem"></i>' + (r.pickupAddress || 'Pickup') + '</div><div class="mb-3"><i class="bi bi-geo-alt-fill text-danger me-2"></i>' + (r.destinationAddress || 'Destination') + '</div><div class="small text-muted">Type: ' + (r.rideType||'').toUpperCase() + ' · ' + formatDate(r.createdAt||r.created_at) + '</div>';
      if (r.driver) {
        document.getElementById('driverBox').style.display = 'block';
        document.getElementById('driverInfo').innerHTML = '<div class="fw-semibold">' + (r.driver.fullName || r.driver.name || 'Driver') + '</div><div class="small text-muted">' + (r.driver.vehicleType || '') + ' · ' + (r.driver.plateNumber || '') + '</div><div class="small">' + (r.driver.phone || '') + '</div>';
      }
      const actions = document.getElementById('actions');
      document.getElementById('actionsBox').style.display = 'block';
      let html = '';
      if (['searching','requested','accepted','arriving','arrived'].includes(st)) {
        html += '<button class="btn btn-outline-danger" onclick="cancelRide()">Cancel ride</button>';
        html += '<p class="small text-muted mt-2 mb-0" id="cancelFeeHint"><i class="bi bi-info-circle me-1"></i>Cancellation near pickup or after the driver has accepted may incur a fee (per platform policy).</p>';
      }
      if (st === 'completed' && !r.rating) {
        document.getElementById('rateBox').classList.remove('d-none');
      }
      if (!html) html = '<p class="small text-muted mb-0">No actions available.</p>';
      actions.innerHTML = html;
    }
    async function cancelRide() {
      let feeNote = '';
      let preview = null;
      try {
        if (Api.rider.cancelPreview) preview = await Api.rider.cancelPreview(id);
      } catch (_) {}
      const fee = preview && (preview.cancellationFee ?? preview.fee ?? preview.charge);
      if (fee != null && Number(fee) > 0) {
        feeNote = '\n\nEstimated cancellation charge: ' + formatMoney(fee) +
          (preview.reason ? '\n(' + preview.reason + ')' : '') +
          '\nThis may be deducted from your wallet or next ride.';
      } else {
        feeNote = '\n\nNote: Cancelling after a driver accepts or when the driver is nearby may incur a charge according to ZenjiGO policy.';
      }
      if (!confirm('Cancel this ride?' + feeNote)) return;
      try {
        const result = await Api.rider.cancelRide(id, 'Changed mind');
        const charged = result && (result.cancellationFee ?? result.fee ?? result.charge ?? result.amountCharged);
        if (charged != null && Number(charged) > 0) {
          showToast('Ride cancelled. Fee charged: ' + formatMoney(charged));
        } else {
          showToast('Ride cancelled' + (result && result.message ? ': ' + result.message : ''));
        }
        load();
      } catch (e) {
        showToast(e.message || 'Could not cancel ride', 'error');
      }
    }
    async function submitRating() {
      const stars = parseInt(document.getElementById('stars').value, 10);
      const feedback = document.getElementById('feedback').value.trim();
      try {
        await Api.rider.rate(id, stars, feedback || undefined);
        showToast('Thanks for rating!');
        document.getElementById('rateBox').classList.add('d-none');
      } catch (e) { showToast(e.message, 'error'); }
    }
    load();
    window.addEventListener('beforeunload', function() { clearTimeout(pollTimer); });
  </script>
  <script src="../js/rider-ui.js"></script>
  <script src="../js/map.js"></script>

<script>
(async function initRideMap() {
  if (!window.ZenjiMap) return;
  const center = (window.ZENJIGO_CONFIG && window.ZENJIGO_CONFIG.MAP && window.ZENJIGO_CONFIG.MAP.DEFAULT_CENTER) || { lat: -6.1659, lng: 39.2026 };
  try {
    window.__rideMap = await ZenjiMap.createMap('mapBox', { center, zoom: 14, markers: [] });
  } catch (e) {
    console.warn('Map', e.message || e);
  }
})();
</script>

</body>
</html>
