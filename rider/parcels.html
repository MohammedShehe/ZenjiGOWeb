<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parcels – ZenjiGO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="app-sidebar" id="appSidebar">
    <div class="brand">Zenji<span>GO</span></div>
    <nav class="mt-2">
      <a href="dashboard.html" class="nav-link"><i class="bi bi-house"></i> Home</a>
      <a href="parcels.html" class="nav-link active"><i class="bi bi-box-seam"></i> Parcels</a>
      <a href="profile.html" class="nav-link"><i class="bi bi-person"></i> Profile</a>
      <a href="#" class="nav-link" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </nav>
  </aside>
  <div class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-link d-lg-none p-0" onclick="toggleSidebar()"><i class="bi bi-list fs-3"></i></button>
        <h5 class="mb-0 fw-bold">Parcels</h5>
      </div>
      <button class="btn btn-aqua btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">Send parcel</button>
    </div>
    <div class="app-content">
      <div class="card-zenji"><div class="card-body p-0" id="list"><div class="text-center py-4"><div class="spinner-zenji mx-auto"></div></div></div></div>
    </div>
  </div>
  <div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content rounded-4">
      <div class="modal-header border-0"><h5 class="modal-title fw-bold">Send a parcel</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="mb-2"><label class="form-label small fw-semibold">Pickup address</label><input id="pickup" class="form-control"></div>
        <div class="mb-2"><label class="form-label small fw-semibold">Drop-off address</label><input id="dropoff" class="form-control"></div>
        <div class="mb-2"><label class="form-label small fw-semibold">Description</label><input id="desc" class="form-control" placeholder="What are you sending?"></div>
        <div class="mb-3"><label class="form-label small fw-semibold">Recipient phone</label><input id="recipient" class="form-control"></div>
        <button class="btn btn-primary-zenji" onclick="createParcel()">Submit</button>
      </div>
    </div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/utils.js"></script>
  <script>
    if (!requireAuth('rider')) throw new Error('auth');
    async function load() {
      try {
        const data = await Api.rider.parcels();
        const list = Array.isArray(data) ? data : [];
        const el = document.getElementById('list');
        if (!list.length) { el.innerHTML = '<div class="text-center py-4 text-muted">No parcels yet.</div>'; return; }
        el.innerHTML = list.map(p => '<div class="px-3 py-3 border-bottom"><div class="fw-semibold">' + (p.pickupAddress||p.pickup||'') + ' → ' + (p.dropoffAddress||p.destination||'') + '</div><div class="small text-muted">' + (p.description||'') + ' · ' + (p.status||'') + '</div></div>').join('');
      } catch (e) { document.getElementById('list').innerHTML = '<div class="p-3 text-danger">' + e.message + '</div>'; }
    }
    async function createParcel() {
      try {
        await Api.rider.createParcel({ pickupAddress: document.getElementById('pickup').value, destinationAddress: document.getElementById('dropoff').value, description: document.getElementById('desc').value, recipientPhone: document.getElementById('recipient').value });
        showToast('Parcel requested'); bootstrap.Modal.getInstance(document.getElementById('addModal')).hide(); load();
      } catch (e) { showToast(e.message, 'error'); }
    }
    load();
  </script>
  <script src="../js/rider-ui.js"></script>
</body>
</html>
