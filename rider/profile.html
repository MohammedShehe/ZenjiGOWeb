<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile – ZenjiGO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="app-sidebar" id="appSidebar">
    <div class="brand">Zenji<span>GO</span> <small class="d-block text-white-50 fs-6 fw-normal">Rider</small></div>
    <nav class="mt-2">
      <a href="dashboard.html" class="nav-link"><i class="bi bi-house"></i> Home</a>
      <a href="book.html" class="nav-link"><i class="bi bi-plus-circle"></i> Book Ride</a>
      <a href="history.html" class="nav-link"><i class="bi bi-clock-history"></i> History</a>
      <a href="wallet.html" class="nav-link"><i class="bi bi-wallet2"></i> Wallet</a>
      <a href="profile.html" class="nav-link active"><i class="bi bi-person"></i> Profile</a>
      <a href="#" class="nav-link" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </nav>
  </aside>
  <div class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-link d-lg-none p-0" onclick="toggleSidebar()"><i class="bi bi-list fs-3 text-dark"></i></button>
        <h5 class="mb-0 fw-bold">Profile</h5>
      </div>
    </div>
    <div class="app-content">
      <div class="row g-4">
        <div class="col-md-6">
          <div class="card-zenji p-4">
            <h6 class="fw-bold mb-3">Personal info</h6>
            <div class="mb-3">
              <label class="form-label small fw-semibold" for="fullName">Full name</label>
              <input type="text" id="fullName" name="fullName" class="form-control" autocomplete="name" placeholder="Enter your full name" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Phone</label>
              <input type="text" id="phone" class="form-control" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Email</label>
              <div class="input-group">
                <input type="email" id="email" class="form-control" autocomplete="email">
                <span class="input-group-text" id="emailState" title=""><i class="bi bi-patch-check-fill text-success"></i></span>
              </div>
              <div id="otpBox" class="d-none mt-2">
                <div class="small text-muted mb-2">Changing your email? Verify the new address first.</div>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="btnSendOtp" data-no-auto-loading="true">Send verification code</button>
                <div id="otpEntry" class="d-none mt-2">
                  <div class="input-group">
                    <input id="emailOtp" class="form-control" inputmode="numeric" maxlength="8" placeholder="Email OTP" autocomplete="one-time-code">
                    <button type="button" class="btn btn-primary-zenji" id="btnVerifyOtp" data-no-auto-loading="true">Verify email</button>
                  </div>
                </div>
              </div>
            </div>
            <button class="btn btn-primary-zenji" id="btnSave" onclick="saveProfile()">Save changes</button>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card-zenji p-4">
            <h6 class="fw-bold mb-3">Account</h6>
            <a href="payments.html" class="d-flex justify-content-between align-items-center py-2 text-decoration-none text-dark border-bottom">
              <span><i class="bi bi-credit-card me-2"></i>Payment methods</span>
              <i class="bi bi-chevron-right text-muted"></i>
            </a>
            <a href="saved.html" class="d-flex justify-content-between align-items-center py-2 text-decoration-none text-dark border-bottom">
              <span><i class="bi bi-bookmark me-2"></i>Saved locations</span>
              <i class="bi bi-chevron-right text-muted"></i>
            </a>
            <a href="chat.html" class="d-flex justify-content-between align-items-center py-2 text-decoration-none text-dark border-bottom">
              <span><i class="bi bi-chat me-2"></i>Support</span>
              <i class="bi bi-chevron-right text-muted"></i>
            </a>
            <button class="btn btn-outline-danger btn-sm mt-3 w-100" onclick="logout()">Logout</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    if (!requireAuth('rider')) throw new Error('auth');
    (async () => {
      try {
        const me = await Api.rider.me();
        document.getElementById('fullName').value = me.fullName || me.full_name || me.name || Api.getUser()?.fullName || Api.getUser()?.full_name || '';
        document.getElementById('phone').value = me.phone || Api.getUser()?.phone || '';
        document.getElementById('email').value = me.email || Api.getUser()?.email || '';
        originalEmail = cleanMail(); refreshEmailUi();
        // Keep the cached profile in sync with the canonical /rider/me response.
        Api.setUser({ ...(Api.getUser() || {}), ...me, fullName: me.fullName || me.full_name || me.name || '' });
      } catch (e) {
        showToast(e.message, 'error');
      }
    })();
    // ---- Email change needs an OTP, exactly like the app ----
    let originalEmail = '', emailVerified = true, otpSent = false;
    const $ = (id) => document.getElementById(id);
    const cleanMail = () => $('email').value.trim().toLowerCase();
    function refreshEmailUi() {
      const changed = cleanMail() !== '' && cleanMail() !== originalEmail;
      emailVerified = !changed;
      $('otpBox').classList.toggle('d-none', !changed);
      $('otpEntry').classList.toggle('d-none', !otpSent || !changed);
      $('emailState').innerHTML = emailVerified ? '<i class="bi bi-patch-check-fill text-success"></i>' : '<i class="bi bi-envelope-exclamation text-warning"></i>';
    }
    $('email').addEventListener('input', () => { otpSent = false; refreshEmailUi(); });
    $('btnSendOtp').addEventListener('click', async () => {
      const mail = cleanMail();
      if (!mail || !mail.includes('@')) return showToast('Enter a valid email', 'error');
      const btn = $('btnSendOtp'); setLoading(btn, true);
      try { await Api.rider.sendEmailChangeOtp(mail); otpSent = true; refreshEmailUi(); showToast('OTP sent to your email'); }
      catch (e) { showToast(e.message, 'error'); } finally { setLoading(btn, false); }
    });
    $('btnVerifyOtp').addEventListener('click', async () => {
      const code = $('emailOtp').value.trim();
      if (!code) return showToast('Enter the code we emailed you', 'error');
      const btn = $('btnVerifyOtp'); setLoading(btn, true);
      try {
        const me = await Api.rider.verifyEmailChangeOtp(cleanMail(), code);
        originalEmail = cleanMail(); otpSent = false; $('emailOtp').value = '';
        if (me && typeof me === 'object') Api.setUser({ ...(Api.getUser() || {}), ...me });
        refreshEmailUi(); showToast('Email verified');
      } catch (e) { showToast(e.message, 'error'); } finally { setLoading(btn, false); }
    });

    async function saveProfile() {
      const btn = $('btnSave');
      const fullName = $('fullName').value.trim();
      if (!fullName) { showToast('Please enter your full name', 'error'); return; }
      if (cleanMail() !== '' && cleanMail() !== originalEmail && !emailVerified) { showToast('Verify the new email with OTP before saving.', 'error'); return; }
      setLoading(btn, true);
      try {
        // A changed email is applied by the verify endpoint, so only send it when unchanged (as the app does).
        const body = { fullName };
        if (cleanMail() && cleanMail() === originalEmail) body.email = cleanMail();
        const updated = await Api.rider.updateMe(body);
        $('fullName').value = updated.fullName || updated.full_name || fullName;
        Api.setUser({ ...(Api.getUser() || {}), ...updated, fullName: updated.fullName || updated.full_name || fullName });
        showToast('Profile updated');
      } catch (e) {
        showToast(e.message, 'error');
      } finally {
        setLoading(btn, false);
      }
    }
  </script>
  <script src="../js/rider-ui.js"></script>
</body>
</html>
