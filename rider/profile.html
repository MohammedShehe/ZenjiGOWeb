<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile – ZenjiGO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="app-sidebar" id="appSidebar">
    <div class="brand">Zenji<span>GO</span> <small class="d-block text-white-50 fs-6 fw-normal">Rider</small></div>
    <nav class="mt-2">
      <a href="dashboard.html" class="nav-link"><i class="bi bi-house"></i> Home</a>
      <a href="book.html" class="nav-link"><i class="bi bi-plus-circle"></i> Book Ride</a>
      <a href="history.html" class="nav-link"><i class="bi bi-clock-history"></i> History</a>
      <a href="wallet.html" class="nav-link"><i class="bi bi-wallet2"></i> Wallet</a>
      <a href="profile.html" class="nav-link active"><i class="bi bi-person"></i> Profile</a>
      <a href="#" class="nav-link" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </nav>
  </aside>
  <div class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-link d-lg-none p-0" onclick="toggleSidebar()"><i class="bi bi-list fs-3 text-dark"></i></button>
        <h5 class="mb-0 fw-bold">Profile</h5>
      </div>
    </div>
    <div class="app-content">
      <div class="row g-4">
        <div class="col-md-6">
          <div class="card-zenji p-4">
            <h6 class="fw-bold mb-3">Personal info</h6>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Full name</label>
              <input type="text" id="fullName" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Phone</label>
              <input type="text" id="phone" class="form-control" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Email</label>
              <input type="email" id="email" class="form-control">
            </div>
            <button class="btn btn-primary-zenji" id="btnSave" onclick="saveProfile()">Save changes</button>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card-zenji p-4">
            <h6 class="fw-bold mb-3">Account</h6>
            <a href="payments.html" class="d-flex justify-content-between align-items-center py-2 text-decoration-none text-dark border-bottom">
              <span><i class="bi bi-credit-card me-2"></i>Payment methods</span>
              <i class="bi bi-chevron-right text-muted"></i>
            </a>
            <a href="saved.html" class="d-flex justify-content-between align-items-center py-2 text-decoration-none text-dark border-bottom">
              <span><i class="bi bi-bookmark me-2"></i>Saved locations</span>
              <i class="bi bi-chevron-right text-muted"></i>
            </a>
            <a href="chat.html" class="d-flex justify-content-between align-items-center py-2 text-decoration-none text-dark border-bottom">
              <span><i class="bi bi-chat me-2"></i>Support</span>
              <i class="bi bi-chevron-right text-muted"></i>
            </a>
            <button class="btn btn-outline-danger btn-sm mt-3 w-100" onclick="logout()">Logout</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    if (!requireAuth('rider')) throw new Error('auth');
    (async () => {
      try {
        const me = await Api.rider.me();
        document.getElementById('fullName').value = me.fullName || me.name || '';
        document.getElementById('phone').value = me.phone || '';
        document.getElementById('email').value = me.email || '';
      } catch (e) {
        showToast(e.message, 'error');
      }
    })();
    async function saveProfile() {
      const btn = document.getElementById('btnSave');
      setLoading(btn, true);
      try {
        await Api.rider.updateMe({
          fullName: document.getElementById('fullName').value.trim(),
          email: document.getElementById('email').value.trim()
        });
        showToast('Profile updated');
      } catch (e) {
        showToast(e.message, 'error');
      } finally {
        setLoading(btn, false);
      }
    }
  </script>
</body>
</html>
