<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rider Login – ZenjiGO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <!-- Mirrors the mobile rider login: Email → Phone (+ country) → Email OTP → Dashboard -->
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo">Zenji<span>GO</span></div>
      <h1 class="h4 text-center fw-bold mb-1" id="titleText">Welcome Back</h1>
      <p class="text-center text-muted mb-4" id="subtitleText">Sign in with your email to continue</p>

      <div id="stepDetails">
        <div class="mb-3">
          <label class="form-label small fw-semibold" for="email">Email address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" autocomplete="email" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold" for="phone">Phone number</label>
          <div class="input-group">
            <select id="countryCode" class="form-select" style="max-width:140px" aria-label="Country code"></select>
            <input type="tel" id="phone" class="form-control" placeholder="6XX XXX XXX" inputmode="numeric" autocomplete="tel-national">
          </div>
          <div class="form-text">Enter number without country code. Leading 0 is OK.</div>
        </div>
        <button class="btn btn-primary-zenji w-100" id="btnSendOtp" type="button">
          <i class="bi bi-envelope-check me-1"></i>Send OTP
        </button>
        <p class="text-center small text-muted mt-3 mb-0">
          Don't have an account? <a href="register.html" class="text-teal fw-semibold">Sign Up</a>
        </p>
      </div>

      <div id="stepOtp" class="d-none">
        <div class="mb-3">
          <label class="form-label small fw-semibold" for="otp">Enter the 6-digit OTP</label>
          <input type="text" id="otp" class="form-control text-center fs-4" maxlength="6" placeholder="••••••" inputmode="numeric" autocomplete="one-time-code">
        </div>
        <p class="small text-muted" id="countdownWrap"></p>
        <button class="btn btn-primary-zenji w-100 mb-2" id="btnVerify" type="button">
          <i class="bi bi-check-circle me-1"></i>Verify &amp; Continue
        </button>
        <button class="btn btn-link w-100 text-muted" id="btnResend" type="button" disabled>Resend OTP</button>
        <button class="btn btn-link w-100 text-muted" id="btnChange" type="button">Change number</button>
      </div>

      <hr class="my-4">
      <p class="text-center small text-muted mb-0">
        Are you a driver? <a href="../driver/login.html" class="text-teal fw-semibold">Driver login</a><br>
        <a href="../index.html" class="text-muted">← Back to website</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    /* Exact mobile rider login contract:
       POST /auth/rider/send-otp  { phone, email }
       POST /auth/rider/verify-otp { phone, email, code }
    */
    fillCountrySelect(document.getElementById('countryCode'), '+255');

    const $ = (id) => document.getElementById(id);
    let currentPhone = '';
    let currentEmail = '';
    let countdownTimer = null;
    let countdown = 0;

    function phoneValue() {
      return buildPhone($('countryCode').value, $('phone').value.trim());
    }

    function startCountdown(sec) {
      countdown = sec || 60;
      const wrap = $('countdownWrap');
      const btn = $('btnResend');
      btn.disabled = true;
      clearInterval(countdownTimer);
      const tick = () => {
        if (countdown <= 0) {
          clearInterval(countdownTimer);
          wrap.textContent = '';
          btn.disabled = false;
          btn.textContent = 'Resend OTP';
          return;
        }
        wrap.textContent = 'Resend in ' + countdown + ' s';
        btn.textContent = 'Resend in ' + countdown + ' s';
        countdown--;
      };
      tick();
      countdownTimer = setInterval(tick, 1000);
    }

    function showOtpStep() {
      $('stepDetails').classList.add('d-none');
      $('stepOtp').classList.remove('d-none');
      $('titleText').textContent = 'Verify OTP';
      $('subtitleText').textContent = 'Enter the verification code sent to ' + currentEmail;
      $('otp').value = '';
      $('otp').focus();
    }

    function showDetailsStep() {
      $('stepOtp').classList.add('d-none');
      $('stepDetails').classList.remove('d-none');
      $('titleText').textContent = 'Welcome Back';
      $('subtitleText').textContent = 'Sign in with your email to continue';
      clearInterval(countdownTimer);
      $('countdownWrap').textContent = '';
    }

    async function sendOtp() {
      const email = $('email').value.trim().toLowerCase();
      const phone = phoneValue();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showToast('Enter a valid email address', 'error');
        return;
      }
      const localDigits = String($('phone').value || '').replace(/\D/g, '');
      if (localDigits.replace(/^0/, '').length < 7) {
        showToast('Enter a valid phone number', 'error');
        return;
      }
      const btn = $('btnSendOtp');
      setLoading(btn, true);
      try {
        await Api.auth.sendRiderOtp(phone, email);
        currentPhone = phone;
        currentEmail = email;
        showOtpStep();
        startCountdown(60);
        showToast('OTP sent successfully');
      } catch (e) {
        showToast(e.message || 'Could not send OTP', 'error');
      } finally {
        setLoading(btn, false);
      }
    }

    async function verifyOtp() {
      const code = $('otp').value.trim();
      if (!/^\d{6}$/.test(code)) {
        showToast('Enter the 6-digit OTP', 'error');
        return;
      }
      const btn = $('btnVerify');
      setLoading(btn, true);
      try {
        const data = await Api.auth.verifyRiderOtp(currentPhone, currentEmail, code);
        Api.saveTokens(data, 'rider');
        location.href = 'dashboard.html';
      } catch (e) {
        showToast(e.message || 'Verification failed', 'error');
      } finally {
        setLoading(btn, false);
      }
    }

    $('btnSendOtp').addEventListener('click', sendOtp);
    $('btnVerify').addEventListener('click', verifyOtp);
    $('btnResend').addEventListener('click', async () => {
      if (!currentPhone || !currentEmail) return;
      const btn = $('btnResend');
      btn.disabled = true;
      try {
        await Api.auth.sendRiderOtp(currentPhone, currentEmail);
        startCountdown(60);
        showToast('OTP sent successfully');
      } catch (e) {
        showToast(e.message || 'Could not resend', 'error');
        btn.disabled = false;
      }
    });
    $('btnChange').addEventListener('click', showDetailsStep);
    $('otp').addEventListener('keydown', (e) => { if (e.key === 'Enter') verifyOtp(); });
    $('phone').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendOtp(); });
    $('email').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('phone').focus(); });

    if (Api.isLoggedIn() && Api.getRole() === 'rider') location.href = 'dashboard.html';
  </script>
  <script src="../js/i18n.js"></script>
  <script src="../js/rider-ui.js"></script>
</body>
</html>
