<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active Ride – ZenjiGO Driver</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="app-sidebar" id="appSidebar">
    <div class="brand">Zenji<span>GO</span> Driver</div>
    <nav class="mt-2">
      <a href="dashboard.html" class="nav-link"><i class="bi bi-house"></i> Home</a>
      <a href="requests.html" class="nav-link active"><i class="bi bi-bell"></i> Requests</a>
      <a href="history.html" class="nav-link"><i class="bi bi-clock-history"></i> History</a>
      <a href="#" class="nav-link" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </nav>
  </aside>
  <div class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-link d-lg-none p-0" onclick="toggleSidebar()"><i class="bi bi-list fs-3"></i></button>
        <h5 class="mb-0 fw-bold">Active Ride</h5>
      </div>
    </div>
    <div class="app-content">
      <div class="map-placeholder mb-3"><div class="text-center"><i class="bi bi-geo-alt fs-1"></i><br>Navigation map</div></div>
      <div class="card-zenji p-4 mb-3" id="info"><div class="text-center py-3"><div class="spinner-zenji mx-auto"></div></div></div>
      <div class="card-zenji p-4">
        <h6 class="fw-bold mb-3">Update status</h6>
        <div class="d-flex flex-wrap gap-2" id="statusBtns"></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/utils.js"></script>
  <script>
    if (!requireAuth('driver')) throw new Error('auth');
    const id = new URLSearchParams(location.search).get('id');
    if (!id) location.href = 'requests.html';
    const flow = ['arriving', 'arrived', 'started', 'completed'];
    async function load() {
      // Driver history may include the ride; or we show based on status updates
      document.getElementById('info').innerHTML = '<div class="mb-2"><span class="status-badge status-active">Active</span></div><div class="fw-semibold">Ride #' + id + '</div><p class="small text-muted mb-0">Update status as you progress through the trip.</p>';
      document.getElementById('statusBtns').innerHTML = flow.map(s => '<button class="btn btn-outline-secondary btn-sm" onclick="setStatus(\'' + s + '\')">' + s.charAt(0).toUpperCase() + s.slice(1) + '</button>').join('') +
        '<button class="btn btn-outline-danger btn-sm" onclick="setStatus(\'cancelled\')">Cancel</button>';
    }
    async function setStatus(status) {
      try {
        await Api.driver.updateStatus(id, status);
        showToast('Status: ' + status);
        if (status === 'completed' || status === 'cancelled') {
          setTimeout(() => location.href = 'history.html', 1000);
        }
      } catch (e) { showToast(e.message, 'error'); }
    }
    // Share location periodically
    async function shareLoc() {
      try { await Api.driver.updateLocation(-6.1659 + Math.random()*0.01, 39.2026 + Math.random()*0.01); } catch {}
    }
    load();
    shareLoc();
    setInterval(shareLoc, 15000);
  </script>
</body>
</html>
