<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active Ride – ZenjiGO Driver</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="app-sidebar" id="appSidebar">
    <div class="brand">Zenji<span>GO</span> Driver</div>
    <nav class="mt-2">
      <a href="dashboard.html" class="nav-link"><i class="bi bi-house"></i> Home</a>
      <a href="requests.html" class="nav-link active"><i class="bi bi-bell"></i> Requests</a>
      <a href="history.html" class="nav-link"><i class="bi bi-clock-history"></i> History</a>
      <a href="#" class="nav-link" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </nav>
  </aside>
  <div class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-link d-lg-none p-0" onclick="toggleSidebar()"><i class="bi bi-list fs-3"></i></button>
        <h5 class="mb-0 fw-bold">Active Ride</h5>
      </div>
    </div>
    <div class="app-content">
      <div id="banner"></div>
      <div id="activeMap" class="mb-3 rounded-3 overflow-hidden border" style="height:320px;min-height:260px;background:#e8f4f3;"></div>
      <div class="card-zenji p-4 mb-3" id="info"><div class="text-center py-3"><div class="spinner-zenji mx-auto"></div></div></div>
      <div class="card-zenji p-4" id="stepBox">
        <h6 class="fw-bold mb-1" id="stepTitle"></h6>
        <p class="small text-muted" id="stepHint"></p>
        <div class="mb-3 d-none" id="pinWrap">
          <label class="form-label small">Rider's 4-digit PIN</label>
          <input id="pin" class="form-control form-control-lg text-center" inputmode="numeric" maxlength="4" autocomplete="one-time-code" style="letter-spacing:.5em" placeholder="••••">
        </div>
        <div class="d-grid gap-2" id="stepBtns"></div>
        <p class="small text-muted mt-3 mb-0"><i class="bi bi-geo-alt me-1"></i>Your live location is shared with the rider during this ride.</p>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/map.js"></script>
  <script>
    if (!requireAuth('driver')) throw new Error('auth');
    const id = new URLSearchParams(location.search).get('id');
    if (!id) location.href = 'requests.html';
    const $ = (x) => document.getElementById(x);
    const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : null; };

    let ride = null, myPos = null, mapApi = null, locTimer = null, pollTimer = null;
    let polling = false, busy = false, failures = 0, routeKey = '', fitted = false, ended = false;

    async function loadRide() {
      if (polling || ended) return;
      polling = true;
      try {
        ride = await Api.driver.getRide(id);
        failures = 0; $('banner').innerHTML = '';
        render(); refreshMap();
      } catch (e) {
        failures++;
        if (!ride) $('info').innerHTML = '<div class="text-danger">' + esc(e.message) + '</div><button class="btn btn-outline-secondary btn-sm mt-3" onclick="loadRide()">Try again</button>';
        else if (failures >= 2) $('banner').innerHTML = '<div class="alert alert-warning py-2 small">Connection lost — retrying…</div>';
      } finally { polling = false; }
      clearTimeout(pollTimer);
      if (!ended) pollTimer = setTimeout(loadRide, document.hidden ? 15000 : (failures ? Math.min(4000 * (failures + 1), 20000) : 3000));
    }

    function stopAll() { ended = true; clearTimeout(pollTimer); clearInterval(locTimer); }

    function render() {
      const r = ride, st = String(r.status).toLowerCase();
      const due = r.amount_due != null ? r.amount_due : r.estimated_fare;
      $('info').innerHTML =
        '<div class="d-flex justify-content-between align-items-center mb-2"><span class="status-badge status-active">' + esc(st) + '</span><strong>' + formatMoney(due) + '</strong></div>' +
        '<div class="mb-1"><i class="bi bi-circle-fill text-success me-2" style="font-size:.5rem"></i>' + esc(r.pickup_address || 'Pickup') + '</div>' +
        '<div class="mb-2"><i class="bi bi-geo-alt-fill text-danger me-2"></i>' + esc(r.destination_address || 'Destination') + '</div>' +
        '<div class="small text-muted">' + esc(String(r.ride_type || '').toUpperCase()) + ' · ' + esc(r.ride_code || ('Ride #' + id)) + '</div>' +
        (r.rider_name ? '<div class="mt-2 small"><i class="bi bi-person me-1"></i>' + esc(r.rider_name) + (r.rider_phone ? ' · <a href="tel:' + esc(r.rider_phone) + '">Call</a>' : '') + '</div>' : '');

      if (st === 'cancelled') { stopAll(); showToast('This ride was cancelled.', 'warning'); setTimeout(() => location.href = 'requests.html', 1800); return; }
      if (st === 'completed') {
        stopAll();
        const share = r.driver_earnings != null ? ' Your share: ' + formatMoney(r.driver_earnings) + '.' : '';
        $('stepTitle').textContent = 'Trip completed';
        $('stepHint').textContent = 'Payment received.' + share;
        $('pinWrap').classList.add('d-none');
        $('stepBtns').innerHTML = '<a class="btn btn-primary-zenji" href="requests.html">Back to requests</a>';
        return;
      }

      const btns = []; let title = '', hint = '', pin = false;
      const cancel = '<button class="btn btn-outline-danger btn-sm" onclick="act(\'cancelled\')">Cancel ride</button>';
      if (st === 'accepted') { title = 'Head to the pickup'; hint = 'Tap when you start driving to the rider.'; btns.push(['arriving', 'I am on my way', true], cancel); }
      else if (st === 'arriving') { title = 'On the way to pickup'; hint = 'Tap when you reach the pickup point.'; btns.push(['arrived', 'I have arrived', true], cancel); }
      else if (st === 'arrived') { title = 'Start the trip'; hint = 'Ask the rider for the 4-digit PIN shown in their app.'; pin = true; btns.push(['started', 'Start trip', true], cancel); }
      else if (st === 'started' && !r.reached_destination) { title = 'Trip in progress'; hint = 'Tap when you reach the destination so the rider can pay.'; btns.push(['reached', 'I have reached the destination', true]); }
      else if (st === 'started') {
        const ps = r.payment_status;
        title = 'Waiting for payment';
        if (ps === 'awaiting_cash') { hint = 'The rider is paying ' + formatMoney(due) + ' in cash. Confirm once you have received it.'; btns.push(['cash', 'Cash received — end trip', true]); }
        else if (ps === 'processing') hint = 'The rider is approving a mobile-money payment. The trip ends automatically.';
        else hint = 'The rider is choosing how to pay ' + formatMoney(due) + '. This updates automatically.';
      }
      $('stepTitle').textContent = title; $('stepHint').textContent = hint;
      $('pinWrap').classList.toggle('d-none', !pin);
      $('stepBtns').innerHTML = btns.map(b => typeof b === 'string' ? b : '<button class="btn btn-primary-zenji" ' + (busy ? 'disabled' : '') + ' onclick="act(\'' + b[0] + '\')">' + esc(b[1]) + '</button>').join('');
    }

    async function act(action) {
      if (busy) return;
      if (action === 'cancelled' && !confirm('Cancel this ride?')) return;
      let otp;
      if (action === 'started') {
        otp = $('pin').value.trim();
        if (!/^\d{4}$/.test(otp)) { showToast('Enter the rider\'s 4-digit PIN.', 'error'); $('pin').focus(); return; }
      }
      busy = true; render();
      try {
        if (action === 'reached') await Api.driver.reachedDestination(id);
        else if (action === 'cash') await Api.driver.collectCash(id);
        else await Api.driver.updateStatus(id, action, otp);
        if (action === 'started') $('pin').value = '';
      } catch (e) { showToast(e.message, 'error'); }
      busy = false;
      clearTimeout(pollTimer); polling = false; loadRide();
    }

    function markers() {
      const list = [];
      if (ride) {
        const pl = num(ride.pickup_lat), pn = num(ride.pickup_lng), dl = num(ride.destination_lat), dn = num(ride.destination_lng);
        if (pl != null) list.push({ id: 'pickup', lat: pl, lng: pn, label: 'P', title: 'Pickup' });
        if (dl != null) list.push({ id: 'dest', lat: dl, lng: dn, label: 'D', title: 'Destination' });
      }
      if (myPos) { let icon = null; try { icon = ZenjiMap.driverIcon('#0d9488'); } catch (_) {} list.push({ id: 'me', lat: myPos.lat, lng: myPos.lng, title: 'You', icon: icon || undefined, label: icon ? undefined : 'D' }); }
      return list;
    }
    function refreshMap() {
      if (!mapApi || !ride) return;
      const m = markers(); mapApi.setMarkers(m, { fitBounds: false });
      if (m.length > 1 && !fitted) { mapApi.fitTo(m); fitted = true; }
      const st = String(ride.status).toLowerCase();
      const started = st === 'started';
      const pickup = num(ride.pickup_lat) != null ? { lat: num(ride.pickup_lat), lng: num(ride.pickup_lng) } : null;
      const dest = num(ride.destination_lat) != null ? { lat: num(ride.destination_lat), lng: num(ride.destination_lng) } : null;
      const from = started ? pickup : myPos, to = started ? dest : pickup;
      if (!from || !to) return;
      const key = [from.lat.toFixed(3), from.lng.toFixed(3), to.lat.toFixed(3), to.lng.toFixed(3)].join(',');
      if (key !== routeKey) { routeKey = key; try { mapApi.setRoute(from, to); } catch (_) {} }
    }

    let sharing = false;
    async function shareLoc() {
      if (sharing || ended) return; sharing = true;
      try {
        const pos = await ZenjiMap.getCurrentPosition(8000);
        if (pos) { myPos = pos; refreshMap(); await Api.driver.updateLocation(pos.lat, pos.lng, pos.heading, pos.speed, id); }
      } catch (_) {} finally { sharing = false; }
    }

    document.addEventListener('visibilitychange', () => { if (!document.hidden) { clearTimeout(pollTimer); loadRide(); } });
    window.addEventListener('beforeunload', stopAll);

    (async function init() {
      loadRide();
      try {
        const center = (ZENJIGO_CONFIG.MAP && ZENJIGO_CONFIG.MAP.DEFAULT_CENTER) || { lat: -6.1659, lng: 39.2026 };
        mapApi = await ZenjiMap.createMap('activeMap', { center, zoom: 14, markers: [] });
        refreshMap();
      } catch (e) { $('activeMap').innerHTML = '<div class="p-4 text-center text-muted small">Map unavailable right now.</div>'; }
      shareLoc(); locTimer = setInterval(shareLoc, 5000);
    })();
  </script>
  <script src="../js/driver-ui.js"></script>
</body>
</html>
