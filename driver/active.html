<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active Ride – ZenjiGO Driver</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="app-sidebar" id="appSidebar">
    <div class="brand">Zenji<span>GO</span> Driver</div>
    <nav class="mt-2">
      <a href="dashboard.html" class="nav-link"><i class="bi bi-house"></i> Home</a>
      <a href="requests.html" class="nav-link active"><i class="bi bi-bell"></i> Requests</a>
      <a href="history.html" class="nav-link"><i class="bi bi-clock-history"></i> History</a>
      <a href="#" class="nav-link" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </nav>
  </aside>
  <div class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-link d-lg-none p-0" onclick="toggleSidebar()"><i class="bi bi-list fs-3"></i></button>
        <h5 class="mb-0 fw-bold">Active Ride</h5>
      </div>
    </div>
    <div class="app-content">
      <div id="activeMap" class="mb-3 rounded-3 overflow-hidden border" style="height:320px;min-height:280px;background:#e8f4f3;"></div>
      <div class="card-zenji p-4 mb-3" id="info"><div class="text-center py-3"><div class="spinner-zenji mx-auto"></div></div></div>
      <div class="card-zenji p-4">
        <h6 class="fw-bold mb-3">Update status</h6>
        <div class="d-flex flex-wrap gap-2" id="statusBtns"></div>
        <p class="small text-muted mt-3 mb-0"><i class="bi bi-geo-alt me-1"></i>Your live location is shared with the rider while this ride is active.</p>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/map.js"></script>
  <script>
    if (!requireAuth('driver')) throw new Error('auth');
    const id = new URLSearchParams(location.search).get('id');
    if (!id) location.href = 'requests.html';

    const flow = ['arriving', 'arrived', 'started', 'completed'];
    let ride = null;
    let myPos = null;
    let mapApi = null;
    let locTimer = null;
    let pollTimer = null;

    function markersFromRide() {
      const list = [];
      if (ride) {
        if (ride.pickupLat != null || ride.pickup_lat != null) {
          list.push({
            id: 'pickup',
            lat: Number(ride.pickupLat ?? ride.pickup_lat),
            lng: Number(ride.pickupLng ?? ride.pickup_lng),
            label: 'P',
            title: 'Pickup: ' + (ride.pickupAddress || ride.pickup_address || '')
          });
        }
        if (ride.destinationLat != null || ride.destination_lat != null) {
          list.push({
            id: 'dest',
            lat: Number(ride.destinationLat ?? ride.destination_lat),
            lng: Number(ride.destinationLng ?? ride.destination_lng),
            label: 'D',
            title: 'Destination: ' + (ride.destinationAddress || ride.destination_address || '')
          });
        }
      }
      if (myPos) {
        let icon = null;
        try { if (window.ZenjiMap && ZenjiMap.driverIcon) icon = ZenjiMap.driverIcon('#0d9488'); } catch (_) {}
        list.push({
          id: 'me',
          lat: myPos.lat,
          lng: myPos.lng,
          title: 'You (driver)',
          icon: icon || undefined,
          label: icon ? undefined : 'D'
        });
      }
      return list;
    }

    function refreshMap() {
      if (!mapApi) return;
      const m = markersFromRide();
      mapApi.setMarkers(m, { fitBounds: m.length > 1 });
      drawRoute();
    }

    // Road line: driver -> pickup until the trip starts, then pickup -> destination.
    let lastRouteKey = '';
    function drawRoute() {
      if (!mapApi || !ride || typeof mapApi.setRoute !== 'function') return;
      const pt = (la, ln) => (la == null || ln == null || !isFinite(Number(la)) || !isFinite(Number(ln))) ? null : { lat: Number(la), lng: Number(ln) };
      const pickup = pt(ride.pickupLat ?? ride.pickup_lat, ride.pickupLng ?? ride.pickup_lng);
      const dest = pt(ride.destinationLat ?? ride.destination_lat, ride.destinationLng ?? ride.destination_lng);
      const st = String(ride.status || '').toLowerCase();
      const started = st === 'started' || st === 'in_progress';
      const from = started ? pickup : (myPos || null);
      const to = started ? dest : pickup;
      if (!from || !to) { mapApi.clearRoute(); lastRouteKey = ''; return; }
      // Skip the request when nothing meaningful moved (~100 m) to avoid needless API calls.
      const key = [from.lat.toFixed(3), from.lng.toFixed(3), to.lat.toFixed(3), to.lng.toFixed(3)].join(',');
      if (key === lastRouteKey) return;
      lastRouteKey = key;
      mapApi.setRoute(from, to);
    }

    async function loadRide() {
      try {
        let r = null;
        if (Api.driver.getRide) {
          r = await Api.driver.getRide(id);
        } else {
          const hist = await Api.driver.history(50);
          const list = Array.isArray(hist) ? hist : (hist?.rides || hist?.data || []);
          r = list.find(x => String(x.id) === String(id)) || null;
        }
        if (r) {
          ride = r;
          const st = (r.status || 'active').toLowerCase();
          const pickup = r.pickupAddress || r.pickup_address || 'Pickup';
          const dest = r.destinationAddress || r.destination_address || 'Destination';
          const fare = r.fare || r.estimatedFare || r.estimated_fare || r.amount;
          document.getElementById('info').innerHTML =
            '<div class="d-flex justify-content-between mb-2">' +
            '<span class="status-badge status-active">' + st + '</span>' +
            '<strong>' + formatMoney(fare) + '</strong></div>' +
            '<div class="mb-1"><i class="bi bi-circle-fill text-success me-2" style="font-size:0.5rem"></i>' + pickup + '</div>' +
            '<div class="mb-2"><i class="bi bi-geo-alt-fill text-danger me-2"></i>' + dest + '</div>' +
            '<div class="small text-muted">Type: ' + String(r.rideType || r.ride_type || '').toUpperCase() +
            ' · Ride #' + id + '</div>';
          refreshMap();
        } else {
          document.getElementById('info').innerHTML =
            '<div class="mb-2"><span class="status-badge status-active">Active</span></div>' +
            '<div class="fw-semibold">Ride #' + id + '</div>' +
            '<p class="small text-muted mb-0">Update status as you progress through the trip.</p>';
        }
      } catch (e) {
        document.getElementById('info').innerHTML =
          '<div class="fw-semibold">Ride #' + id + '</div><p class="small text-muted mb-0">' + (e.message || 'Unable to load ride details') + '</p>';
      }

      document.getElementById('statusBtns').innerHTML =
        flow.map(s => '<button class="btn btn-outline-secondary btn-sm" onclick="setStatus(\'' + s + '\')">' +
          s.charAt(0).toUpperCase() + s.slice(1) + '</button>').join('') +
        '<button class="btn btn-outline-danger btn-sm" onclick="setStatus(\'cancelled\')">Cancel</button>';
    }

    async function setStatus(status) {
      try {
        await Api.driver.updateStatus(id, status);
        showToast('Status: ' + status);
        if (status === 'completed' || status === 'cancelled') {
          clearInterval(locTimer);
          clearInterval(pollTimer);
          setTimeout(() => location.href = 'history.html', 1000);
        } else {
          loadRide();
        }
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function shareLoc() {
      try {
        const pos = await ZenjiMap.getCurrentPosition(8000);
        if (!pos) return;
        myPos = pos;
        await Api.driver.updateLocation(pos.lat, pos.lng);
        refreshMap();
      } catch (_) {}
    }

    (async function init() {
      await loadRide();
      try {
        const center = (ZENJIGO_CONFIG.MAP && ZENJIGO_CONFIG.MAP.DEFAULT_CENTER) || { lat: -6.1659, lng: 39.2026 };
        const here = await ZenjiMap.getCurrentPosition(6000);
        mapApi = await ZenjiMap.createMap('activeMap', {
          center: here || center,
          zoom: 14,
          markers: markersFromRide(),
          fitBounds: true
        });
        if (here) {
          myPos = here;
          refreshMap();
        }
      } catch (e) {
        console.warn('Map', e.message || e);
        const box = document.getElementById('activeMap');
        if (box) box.innerHTML = '<div class="p-4 text-center text-muted small">Map unavailable. Set GOOGLE_MAPS_API_KEY in js/config.js.</div>';
      }
      shareLoc();
      locTimer = setInterval(shareLoc, 12000);
      pollTimer = setInterval(loadRide, 20000);
      window.addEventListener('beforeunload', () => {
        clearInterval(locTimer);
        clearInterval(pollTimer);
      });
    })();
  </script>
  <script src="../js/driver-ui.js"></script>
</body>
</html>
