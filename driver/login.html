<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Login – ZenjiGO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo">Zenji<span>GO</span></div>
      <p class="text-center text-muted mb-4">Driver sign in with email OTP</p>

      <div id="stepPhone">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Email address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Phone number</label>
          <div class="input-group">
            <select id="countryCode" class="form-select" style="max-width:140px"></select>
            <input type="tel" id="phone" class="form-control" placeholder="6XX XXX XXX" inputmode="numeric" autocomplete="tel-national">
          </div>
          <div class="form-text">Enter number without country code. Leading 0 is OK.</div>
        </div>
        <button class="btn btn-primary-zenji" id="btnSend" onclick="sendOtp()">Send OTP</button>
      </div>

      <div id="stepOtp" class="d-none">
        <p class="small text-muted">Code sent to <strong id="displayPhone"></strong>
          <span id="countdownWrap" class="ms-1 text-teal"></span>
        </p>
        <div class="mb-3">
          <label class="form-label small fw-semibold">OTP Code</label>
          <input type="text" id="otp" class="form-control text-center fs-4" maxlength="8" inputmode="numeric" autocomplete="one-time-code">
        </div>
        <button class="btn btn-primary-zenji mb-2" id="btnVerify" onclick="verify()">Verify & Continue</button>
        <button class="btn btn-link w-100 text-muted" id="btnResend" onclick="sendOtp()" disabled>Resend OTP</button>
        <button class="btn btn-link w-100 text-muted" onclick="backToPhone()">Change details</button>
      </div>

      <hr class="my-4">
      <p class="text-center small text-muted mb-0">
        New driver? <a href="register.html" class="text-teal fw-semibold">Register here</a><br>
        <a href="../rider/login.html" class="text-muted">Rider login</a> · <a href="../index.html" class="text-muted">Website</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    fillCountrySelect(document.getElementById('countryCode'), '+255');
    let currentPhone = '';
    let currentEmail = '';
    let countdownTimer = null;
    let countdown = 0;

    function startCountdown(sec) {
      countdown = sec || 60;
      const wrap = document.getElementById('countdownWrap');
      const btn = document.getElementById('btnResend');
      btn.disabled = true;
      clearInterval(countdownTimer);
      countdownTimer = setInterval(function () {
        countdown--;
        if (countdown <= 0) {
          clearInterval(countdownTimer);
          wrap.textContent = '';
          btn.disabled = false;
          btn.textContent = 'Resend OTP';
        } else {
          wrap.textContent = '(resend in ' + countdown + 's)';
          btn.textContent = 'Resend in ' + countdown + 's';
        }
      }, 1000);
    }

    async function sendOtp() {
      const email = document.getElementById('email').value.trim().toLowerCase();
      const local = document.getElementById('phone').value.trim();
      const code = document.getElementById('countryCode').value;
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showToast('Enter a valid email address', 'error');
        return;
      }
      // Exact same as Flutter driver app: countryCode + localNumber
      currentPhone = buildPhone(code, local);
      currentEmail = email;
      const btn = document.getElementById('btnSend');
      setLoading(btn, true);
      try {
        const sent = await Api.auth.sendDriverOtp(currentPhone, currentEmail, 'login');
        currentEmail = sent.target || currentEmail;
        document.getElementById('displayPhone').textContent = sent.maskedEmail || currentEmail;
        document.getElementById('stepPhone').classList.add('d-none');
        document.getElementById('stepOtp').classList.remove('d-none');
        startCountdown(60);
        showToast('OTP sent');
      } catch (e) {
        showToast(e.message || 'Failed to send OTP', 'error');
      } finally {
        setLoading(btn, false);
      }
    }

    async function verify() {
      const otp = document.getElementById('otp').value.trim();
      if (!otp || otp.length < 4) {
        showToast('Enter OTP', 'error');
        return;
      }
      const btn = document.getElementById('btnVerify');
      setLoading(btn, true);
      try {
        const data = await Api.auth.loginDriver(currentPhone, currentEmail, otp);
        const access = data.accessToken || data.access || (data.tokens && data.tokens.accessToken);
        const refresh = data.refreshToken || data.refresh || (data.tokens && data.tokens.refreshToken);
        if (access) Api.setTokens(access, refresh);
        Api.setRole('driver');
        if (data.user || data.driver) Api.setUser(data.user || data.driver);
        showToast('Welcome back!');
        setTimeout(function () { location.href = 'dashboard.html'; }, 500);
      } catch (e) {
        showToast(e.message || 'Invalid OTP', 'error');
      } finally {
        setLoading(btn, false);
      }
    }

    function backToPhone() {
      clearInterval(countdownTimer);
      document.getElementById('stepOtp').classList.add('d-none');
      document.getElementById('stepPhone').classList.remove('d-none');
    }

    if (Api.isLoggedIn() && Api.getRole() === 'driver') {
      location.href = 'dashboard.html';
    }
  </script>
  <script src="../js/driver-ui.js"></script>
</body>
</html>
