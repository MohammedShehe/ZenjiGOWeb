<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ride History – ZenjiGO Driver</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="app-sidebar" id="appSidebar">
    <div class="brand">Zenji<span>GO</span> Driver</div>
    <nav class="mt-2">
      <a href="dashboard.html" class="nav-link"><i class="bi bi-house"></i> Home</a>
      <a href="history.html" class="nav-link active"><i class="bi bi-clock-history"></i> History</a>
      <a href="earnings.html" class="nav-link"><i class="bi bi-cash-stack"></i> Earnings</a>
      <a href="profile.html" class="nav-link"><i class="bi bi-person"></i> Profile</a>
      <a href="#" class="nav-link" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </nav>
  </aside>
  <div class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-link d-lg-none p-0" onclick="toggleSidebar()"><i class="bi bi-list fs-3"></i></button>
        <h5 class="mb-0 fw-bold">Ride History</h5>
      </div>
    </div>
    <div class="app-content">
      <div class="card-zenji"><div class="card-body p-0" id="list"><div class="text-center py-4"><div class="spinner-zenji mx-auto"></div></div></div></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/utils.js"></script>
  <script>
    if (!requireAuth('driver')) throw new Error('auth');
    (async () => {
      try {
        const response = await Api.driver.history(100);
        const list = Array.isArray(response) ? response : (response.rides || response.items || response.data || []);
        const el = document.getElementById('list');
        if (!list.length) { el.innerHTML = '<div class="text-center py-5 text-muted">No rides yet.</div>'; return; }
        const val = (obj, ...keys) => { for (const k of keys) if (obj && obj[k] != null && obj[k] !== '') return obj[k]; return ''; };
        const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        el.innerHTML = list.map(r => {
          const pickup = val(r, 'pickupAddress', 'pickup_address') || 'Pickup location';
          const dropoff = val(r, 'destinationAddress', 'destination_address', 'dropoffAddress', 'dropoff_address') || 'Drop-off location';
          const status = val(r, 'status') || 'unknown';
          const statusClass = status.toLowerCase() === 'completed' ? 'online' : 'pending';
          const date = val(r, 'completed_at', 'completedAt', 'created_at', 'createdAt');
          const type = val(r, 'rideType', 'ride_type');
          const amount = val(r, 'driverEarning', 'driver_earning', 'driver_share', 'final_fare', 'finalFare', 'estimated_fare', 'estimatedFare', 'fare', 'amount');
          return `<div class="d-flex justify-content-between px-3 py-3 border-bottom gap-3"><div class="min-w-0"><div class="fw-semibold">${esc(pickup)} → ${esc(dropoff)}</div><div class="small text-muted">${esc(date ? formatDate(date) : 'Date unavailable')} · ${esc(type)}</div></div><div class="text-end flex-shrink-0"><div class="fw-semibold">${formatMoney(amount || 0)}</div><span class="status-badge status-${statusClass}">${esc(status)}</span></div></div>`;
        }).join('');
      } catch (e) { document.getElementById('list').innerHTML = '<div class="text-center py-4 text-danger">' + e.message + '</div>'; }
    })();
  </script>
  <script src="../js/driver-ui.js"></script>
</body>
</html>
