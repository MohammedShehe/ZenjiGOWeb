<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ride Requests – ZenjiGO Driver</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="app-sidebar" id="appSidebar">
    <div class="brand">Zenji<span>GO</span> Driver</div>
    <nav class="mt-2">
      <a href="dashboard.html" class="nav-link"><i class="bi bi-house"></i> Home</a>
      <a href="requests.html" class="nav-link active"><i class="bi bi-bell"></i> Requests</a>
      <a href="earnings.html" class="nav-link"><i class="bi bi-cash-stack"></i> Earnings</a>
      <a href="history.html" class="nav-link"><i class="bi bi-clock-history"></i> History</a>
      <a href="profile.html" class="nav-link"><i class="bi bi-person"></i> Profile</a>
      <a href="#" class="nav-link" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </nav>
  </aside>
  <div class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-link d-lg-none p-0" onclick="toggleSidebar()"><i class="bi bi-list fs-3"></i></button>
        <h5 class="mb-0 fw-bold">Ride Requests</h5>
      </div>
    </div>
    <div class="app-content">
      <div id="requestsMap" class="mb-3 rounded-3 overflow-hidden border" style="height:280px;min-height:240px;background:#e8f4f3;"></div>
      <p class="small text-muted mb-2"><i class="bi bi-info-circle me-1"></i>Map shows nearby waiting riders (pickup points). Stay online to receive requests.</p>
      <div class="card-zenji"><div class="card-body p-0" id="list"><div class="text-center py-4"><div class="spinner-zenji mx-auto"></div></div></div></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/map.js"></script>
  <script>
    if (!requireAuth('driver')) throw new Error('auth');
    let mapApi = null;
    let myPos = null;
    let lastRequests = [];

    function requestMarkers(list) {
      const markers = [];
      if (myPos) {
        let icon = null;
        try { if (ZenjiMap.driverIcon) icon = ZenjiMap.driverIcon('#0d9488'); } catch (_) {}
        markers.push({ id: 'me', lat: myPos.lat, lng: myPos.lng, title: 'You', icon: icon || undefined, label: icon ? undefined : 'D' });
      }
      (list || []).forEach((r, i) => {
        const lat = r.pickupLat ?? r.pickup_lat;
        const lng = r.pickupLng ?? r.pickup_lng;
        if (lat == null || lng == null) return;
        markers.push({
          id: 'req-' + (r.id || i),
          lat: Number(lat),
          lng: Number(lng),
          label: 'R',
          title: (r.pickupAddress || r.pickup_address || 'Rider request') + ' · ' + String(r.rideType || r.ride_type || '').toUpperCase(),
          info: '<div class="small"><strong>' + (r.pickupAddress || r.pickup_address || 'Pickup') + '</strong><br>' +
            String(r.rideType || r.ride_type || '').toUpperCase() + ' · ' + formatMoney(r.fare || r.estimatedFare || r.estimated_fare) +
            '<br><button class="btn btn-sm btn-aqua mt-1" onclick="accept(\'' + r.id + '\')">Accept</button></div>'
        });
      });
      return markers;
    }

    async function load() {
      try {
        const data = await Api.driver.rideRequests();
        const list = data.requests || (Array.isArray(data) ? data : []);
        lastRequests = list;
        const el = document.getElementById('list');
        if (!list.length) {
          el.innerHTML = '<div class="text-center py-5 text-muted">No requests right now. Stay online!</div>';
        } else {
          el.innerHTML = list.map(r => {
            const pickup = r.pickupAddress || r.pickup_address || 'Pickup';
            const dest = r.destinationAddress || r.destination_address || 'Drop-off';
            const fare = r.fare || r.estimatedFare || r.estimated_fare;
            const masked = r.masked ? ' <span class="badge bg-warning text-dark">Settlement required</span>' : '';
            return '<div class="px-3 py-3 border-bottom d-flex justify-content-between align-items-center"><div><div class="fw-semibold">' +
              pickup + ' → ' + dest + masked + '</div><div class="small text-muted">' +
              String(r.rideType || r.ride_type || '').toUpperCase() + ' · ' + formatMoney(fare) +
              '</div></div><button class="btn btn-aqua btn-sm" onclick="accept(\'' + r.id + '\')" ' +
              (r.masked ? 'disabled' : '') + '>Accept</button></div>';
          }).join('');
        }
        if (mapApi) mapApi.setMarkers(requestMarkers(list), { fitBounds: true });
      } catch (e) {
        document.getElementById('list').innerHTML = '<div class="text-center py-4 text-danger">' + e.message + '</div>';
      }
    }

    async function accept(id) {
      try {
        await Api.driver.acceptRide(id);
        showToast('Accepted');
        location.href = 'active.html?id=' + id;
      } catch (e) { showToast(e.message, 'error'); }
    }
    window.accept = accept;

    (async function init() {
      try {
        const center = (ZENJIGO_CONFIG.MAP && ZENJIGO_CONFIG.MAP.DEFAULT_CENTER) || { lat: -6.1659, lng: 39.2026 };
        myPos = await ZenjiMap.getCurrentPosition(6000);
        mapApi = await ZenjiMap.createMap('requestsMap', {
          center: myPos || center,
          zoom: 13,
          markers: [],
          fitBounds: false
        });
        if (myPos) {
          try { await Api.driver.updateLocation(myPos.lat, myPos.lng); } catch (_) {}
        }
      } catch (e) {
        console.warn('Map', e.message || e);
        const box = document.getElementById('requestsMap');
        if (box) box.innerHTML = '<div class="p-4 text-center text-muted small">Map unavailable. Set GOOGLE_MAPS_API_KEY in js/config.js.</div>';
      }
      await load();
      setInterval(load, 10000);
      setInterval(async () => {
        try {
          const pos = await ZenjiMap.getCurrentPosition(5000);
          if (pos) {
            myPos = pos;
            await Api.driver.updateLocation(pos.lat, pos.lng);
            if (mapApi) mapApi.setMarkers(requestMarkers(lastRequests), { fitBounds: false });
          }
        } catch (_) {}
      }, 20000);
    })();
  </script>
  <script src="../js/driver-ui.js"></script>
</body>
</html>
