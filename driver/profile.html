<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Profile – ZenjiGO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="app-sidebar" id="appSidebar">
    <div class="brand">Zenji<span>GO</span> Driver</div>
    <nav class="mt-2">
      <a href="dashboard.html" class="nav-link"><i class="bi bi-house"></i> Home</a>
      <a href="profile.html" class="nav-link active"><i class="bi bi-person"></i> Profile</a>
      <a href="earnings.html" class="nav-link"><i class="bi bi-cash-stack"></i> Earnings</a>
      <a href="#" class="nav-link" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </nav>
  </aside>
  <div class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-link d-lg-none p-0" onclick="toggleSidebar()"><i class="bi bi-list fs-3"></i></button>
        <h5 class="mb-0 fw-bold">Profile</h5>
      </div>
    </div>
    <div class="app-content">
      <div class="row g-4">
        <div class="col-md-6">
          <div class="card-zenji p-4" id="profileCard">
            <div class="text-center py-3"><div class="spinner-zenji mx-auto"></div></div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card-zenji p-4">
            <h6 class="fw-bold mb-3">Documents</h6>
            <div id="docs"><div class="text-muted small">Loading...</div></div>
          </div>
          <div class="card-zenji p-4 mt-3">
            <button class="btn btn-outline-danger w-100" onclick="logout()">Logout</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/utils.js"></script>
  <script>
    if (!requireAuth('driver')) throw new Error('auth');
    (async () => {
      try {
        const me = await Api.driver.me();
        document.getElementById('profileCard').innerHTML = '<h6 class="fw-bold mb-3">Personal info</h6>' +
          '<div class="mb-2"><span class="text-muted small">Name</span><div class="fw-semibold">' + (me.fullName||me.name||'—') + '</div></div>' +
          '<div class="mb-2"><span class="text-muted small">Phone</span><div class="fw-semibold">' + (me.phone||'—') + '</div></div>' +
          '<div class="mb-2"><span class="text-muted small">Email</span><div class="fw-semibold">' + (me.email||'—') + '</div></div>' +
          '<div class="mb-2"><span class="text-muted small">Vehicle</span><div class="fw-semibold">' + (me.vehicleType||'') + ' · ' + (me.plateNumber||'') + '</div></div>' +
          '<div><span class="text-muted small">Status</span><div><span class="status-badge ' + (me.online?'status-online':'status-offline') + '">' + (me.online?'Online':'Offline') + '</span> · ' + (me.approvalStatus||me.status||'') + '</div></div>';
      } catch (e) { document.getElementById('profileCard').innerHTML = '<div class="text-danger">' + e.message + '</div>'; }
      try {
        const d = await Api.driver.documents();
        const list = Array.isArray(d) ? d : (d.documents || []);
        document.getElementById('docs').innerHTML = list.length ? list.map(doc => '<div class="d-flex justify-content-between py-2 border-bottom"><span>' + (doc.type||doc.name||'Document') + '</span><span class="status-badge status-' + ((doc.status||'')==='approved'?'online':'pending') + '">' + (doc.status||'') + '</span></div>').join('') : '<span class="text-muted small">No documents listed.</span>';
      } catch (e) { document.getElementById('docs').innerHTML = '<span class="text-muted small">' + e.message + '</span>'; }
    })();
  </script>
</body>
</html>
