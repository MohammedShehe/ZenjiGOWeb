<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earnings – ZenjiGO Driver</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <aside class="app-sidebar" id="appSidebar">
    <div class="brand">Zenji<span>GO</span> Driver</div>
    <nav class="mt-2">
      <a href="dashboard.html" class="nav-link"><i class="bi bi-house"></i> Home</a>
      <a href="earnings.html" class="nav-link active"><i class="bi bi-cash-stack"></i> Earnings</a>
      <a href="history.html" class="nav-link"><i class="bi bi-clock-history"></i> History</a>
      <a href="profile.html" class="nav-link"><i class="bi bi-person"></i> Profile</a>
      <a href="#" class="nav-link" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </nav>
  </aside>
  <div class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-link d-lg-none p-0" onclick="toggleSidebar()"><i class="bi bi-list fs-3"></i></button>
        <h5 class="mb-0 fw-bold">Earnings & Finance</h5>
      </div>
    </div>
    <div class="app-content">
      <div class="row g-4 mb-4">
        <div class="col-md-4"><div class="card-zenji p-4"><div class="small text-muted">Total earnings</div><h3 class="fw-bold" id="total">—</h3></div></div>
        <div class="col-md-4"><div class="card-zenji p-4"><div class="small text-muted">Available</div><h3 class="fw-bold" id="available">—</h3></div></div>
        <div class="col-md-4"><div class="card-zenji p-4"><div class="small text-muted">Pending settlement</div><h3 class="fw-bold" id="pending">—</h3></div></div>
      </div>
      <div class="card-zenji p-4 mb-4">
        <h6 class="fw-bold mb-3">Request payout</h6>
        <div class="row g-2 align-items-end">
          <div class="col-md-4"><label class="form-label small">Amount (TZS)</label><input type="number" id="payoutAmt" class="form-control" min="1000"></div>
          <div class="col-md-4"><label class="form-label small">Method</label>
            <select id="payoutMethod" class="form-select"><option value="momo">Mobile Money</option><option value="bank">Bank</option></select>
          </div>
          <div class="col-md-4"><button class="btn btn-primary-zenji" onclick="requestPayout()">Request</button></div>
        </div>
      </div>
      <div class="card-zenji">
        <div class="card-header">Finance details</div>
        <div class="card-body" id="finance"><div class="text-muted small">Loading...</div></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/utils.js"></script>
  <script>
    if (!requireAuth('driver')) throw new Error('auth');
    async function load() {
      try {
        const e = await Api.driver.earnings();
        document.getElementById('total').textContent = formatMoney(e.total || e.totalEarnings || 0);
        document.getElementById('available').textContent = formatMoney(e.available || e.balance || 0);
        document.getElementById('pending').textContent = formatMoney(e.pending || 0);
      } catch {}
      try {
        const f = await Api.driver.finance();
        document.getElementById('finance').innerHTML = '<pre class="small mb-0" style="white-space:pre-wrap">' + JSON.stringify(f, null, 2) + '</pre>';
      } catch (e) { document.getElementById('finance').innerHTML = '<span class="text-muted small">' + e.message + '</span>'; }
    }
    async function requestPayout() {
      const amount = parseFloat(document.getElementById('payoutAmt').value);
      const method = document.getElementById('payoutMethod').value;
      if (!amount) { showToast('Enter amount', 'error'); return; }
      try {
        await Api.driver.payout(amount, method);
        showToast('Payout requested');
        load();
      } catch (e) { showToast(e.message, 'error'); }
    }
    load();
  </script>
  <script src="../js/driver-ui.js"></script>
</body>
</html>
